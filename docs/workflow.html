<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>EDA 赛题六 · 工作流编辑器</title>
<style>
:root{--bg:#0d1117;--panel:#111820;--bor:#2b3543;--fg:#c9d1d9;--dim:#7d8590;--acc:#58a6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:12.5px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:212px 1fr 286px;grid-template-rows:46px 1fr;height:100%}
#top{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--bor)}
#top b{font-size:13px}
#top .sp{flex:1}
button{background:#1b2430;color:var(--fg);border:1px solid var(--bor);border-radius:5px;
  padding:5px 10px;font:inherit;cursor:pointer}
button:hover{background:#243040;border-color:#3d4b5c}
button.pri{background:#1f6feb;border-color:#1f6feb;color:#fff}
button.pri:hover{background:#2b7ef5}
#left,#right{background:var(--panel);overflow-y:auto;padding:10px}
#left{border-right:1px solid var(--bor)}
#right{border-left:1px solid var(--bor)}
h4{margin:10px 0 6px;font-size:11px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
h4:first-child{margin-top:2px}
.pitem{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;
  cursor:pointer;border:1px solid transparent;margin-bottom:3px}
.pitem:hover{background:#1b2430;border-color:var(--bor)}
.dotc{width:8px;height:8px;border-radius:2px;flex:none}
.nlist{margin:0;padding:0;list-style:none}
.nlist li{padding:3px 6px;border-radius:4px;cursor:pointer;font-size:11.5px}
.nlist li:hover{background:#1b2430}
.lab{color:var(--dim);font-size:11px}
input,select,textarea{width:100%;background:#0d1117;color:var(--fg);border:1px solid var(--bor);
  border-radius:5px;padding:4px 6px;font:inherit}
textarea{resize:vertical;min-height:170px}
.row{margin-bottom:7px}
.row>span{display:block;color:var(--dim);font-size:11px;margin-bottom:2px}
#canvas{position:relative;overflow:hidden;background:
  linear-gradient(#151b24 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,#151b24 1px,transparent 1px) 0 0/24px 24px,var(--bg);
  cursor:grab}
#canvas.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#links path.hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
#links path.wire{fill:none;stroke-width:1.8;pointer-events:none}
#links path.wire.sel{stroke:#fff!important;stroke-width:3}
.node{position:absolute;background:#131a23;border:1px solid var(--bor);border-radius:7px;
  box-shadow:0 2px 10px #0007;user-select:none}
.node.sel{border-color:#fff;box-shadow:0 0 0 1px #fff,0 2px 14px #000a}
.node .hd{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--bor);
  border-left:4px solid var(--acc);border-radius:6px 6px 0 0;cursor:move;font-weight:600;font-size:12px}
.node .bd{padding:6px 8px 8px}
.node .sub{color:var(--dim);font-size:10.5px;line-height:1.35;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .bul{margin:0 0 5px;padding:3px 4px 4px;background:#0f1620;border:1px solid #212b38;
  border-radius:5px;list-style:none;font-size:10px;line-height:1.45;color:#aeb8c4}
.node .bul li{position:relative;padding-left:9px}
.node .bul li:before{content:'\25B8';position:absolute;left:1px;color:#4a5b6d}
.node .bul b{color:#e6edf3;font-weight:600}
#insp .rd{padding-bottom:24px}
.rt{font-size:14px;font-weight:700;border-left:3px solid;padding-left:7px;margin:2px 0 6px}
.rmeta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.rsub{color:#aeb8c4;font-size:11.5px;line-height:1.5;margin-bottom:5px}
.rfile{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:#7d8590;
  margin-bottom:6px;word-break:break-all}
.rsec{margin:11px 0 6px;font-size:10px;letter-spacing:.09em;color:#7d8590;
  text-transform:uppercase;border-top:1px solid #212b38;padding-top:7px}
.rports div{margin-bottom:3px;line-height:1.9}
.rports i{display:inline-block;background:#1b2430;border:1px solid #2b3543;border-radius:4px;
  padding:0 5px;margin:0 3px 3px 0;font-style:normal;font-size:10.5px;color:#9aa5b1}
.rpar .rp{display:grid;grid-template-columns:100px 1fr;gap:6px;margin-bottom:5px;
  font-size:11px;align-items:start}
.rpar .rp b{color:#e6edf3;font-weight:600;font-family:ui-monospace,Consolas,monospace;
  font-size:10.5px;word-break:break-all}
.rpar .rp span{color:#aeb8c4}
.rbul{padding-left:0;list-style:none;margin:0}
.rbul li{position:relative;padding-left:12px;margin-bottom:6px;font-size:11.5px;
  line-height:1.55;color:#c9d1d9}
.rbul li:before{content:'\25B8';position:absolute;left:0;color:#58a6ff}
.rbul code,.rnote code{background:#1b2430;border-radius:3px;padding:0 3px;
  font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:#79c0ff}
.rbul b,.rnote b{color:#e6edf3}
.rnote{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;
  line-height:1.6;color:#8b949e}
.ports{display:flex;justify-content:space-between;gap:6px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.col.out{align-items:flex-end}
.port{display:flex;align-items:center;gap:4px;font-size:10.5px;color:#9aa5b1;white-space:nowrap;
  max-width:100%;overflow:hidden}
.port .dot{width:9px;height:9px;border-radius:50%;background:#30404f;border:1px solid #4a5b6d;
  flex:none;cursor:crosshair}
.port.out .dot{order:2}
.port:hover .dot{background:#58a6ff;border-color:#58a6ff}
.port .t{overflow:hidden;text-overflow:ellipsis}
.params{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px}
.prm{background:#1b2430;border:1px solid var(--bor);border-radius:4px;padding:0 4px;
  font-size:10px;color:#9aa5b1;font-family:ui-monospace,Consolas,monospace}
.kbadge{font-size:9px;padding:0 4px;border-radius:3px;border:1px solid;line-height:14px}
#hint{position:absolute;left:10px;bottom:8px;color:var(--dim);font-size:11px;
  background:#0d1117cc;padding:3px 8px;border-radius:5px;pointer-events:none}
#insp .empty{color:var(--dim);font-size:11.5px;padding:6px 0}
.kv{display:grid;grid-template-columns:1fr 1fr 22px;gap:3px;margin-bottom:3px}
.kv button{padding:1px 5px;font-size:11px}
#dlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#dlg.on{display:flex}
#dlg .box{background:var(--panel);border:1px solid var(--bor);border-radius:8px;padding:14px;
  width:min(760px,90vw);max-height:80vh;display:flex;flex-direction:column;gap:8px}
#dlg textarea{flex:1;min-height:340px;font-family:ui-monospace,Consolas,monospace;font-size:11px}
.tag{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid var(--bor);color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <b>EDA 赛题六 · 工作流</b>
    <span id="gname" class="lab"></span>
    <span class="tag" id="stat"></span>
    <span class="tag" id="ver" title="这个数字是 graph.json 的指纹；文件一改它就变"></span>
    <span class="sp"></span>
    <button onclick="fit()">适应窗口</button>
    <button onclick="toggleMode()" id="mbtn" class="pri">✎ 编辑</button>
    <button onclick="tidy()">整理布局</button>
    <button onclick="showChanges()">改动说明</button>
    <button onclick="showJSON()">导出 JSON</button>
    <button onclick="importJSON()">导入 JSON</button>
    <button onclick="resetAll()">还原基线</button>
  </div>

  <div id="left">
    <h4>加节点</h4>
    <div id="palette"></div>
    <h4>节点列表</h4>
    <ul class="nlist" id="nlist"></ul>
  </div>

  <div id="canvas">
    <div id="world">
      <svg id="links" width="9000" height="6000"></svg>
      <div id="nodes"></div>
    </div>
    <div id="hint">滚轮缩放 · 空白处拖动平移 · 拖节点的圆点到另一个圆点连线 · 选中后按 Delete 删除</div>
  </div>

  <div id="right"><div id="insp"></div></div>
</div>

<div id="dlg"><div class="box">
  <b id="dlgtitle"></b>
  <textarea id="dlgtext" spellcheck="false"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="pri" onclick="copyDlg()">复制</button>
    <button onclick="closeDlg()">关闭</button>
  </div>
</div></div>

<script type="application/json" id="graphdata">
{
 "name": "目标架构 · 证据层 → 约束求解 → 迭代重扫（实测：官方 10GT 9 张 58.63 / 派生 19 张 36.35 · 交付口径 VLM auto + fusion on · **★ 引脚通道：写进文档却没人读的真 bug，修掉后官方 9 张 +2.88（派生 220 −0.07、「只补号」零回归）**）",
 "score": null,
 "note": "**★ 第十批：引脚通道逐条审计 ——「不产出 / 点错 / 读错」三分账**\n\n第九批定了「引脚 + 网络 = 60% 权重、同一个根因」。这一批把这个根因**拆到根数**，\n结论是：**一半的缺口跟识别模型无关**（读对了号却因为没名字整条不发），\n而**就算识别全对，也只值 +4.60 分**；但要小心：**「缺口在这一类」不等于「关掉那个开关就能拿回来」**\n（第 9 行那个 A/B 就是反例）。\n\n| # | 查了什么 | 文件 · 工具 | 量出来的结果 | 结论 |\n|---|---|---|---|---|\n| 1 | 官方档的引脚键形状 | ~~`_gtpin10.py`~~ → **`_pinconv.py`（第十一批第 6 行已更正）** | 10GT 的 21 个 IC 里 **20 个（95.2%）的键就是 1..N**、`pinname` 纯数字 **0.0%**；只有 `10GT/1/U1`（n=26）是物理号 | 官方档的号是**小顺序号**、缺口在**名字**上（派生档相反） |\n| 2 | 引脚账本 | `_pinledger.py` | GT 的 IC(box) 引脚 **120 根，我们只发 75**；缺的 45 = **号读对了却被丢 23（51%）** + 号读错 22 + 附近没槽位 6 | 缺口**分成三笔账**，其中一半不在 OCR 上 |\n| 3 | 按**位置**绑定的对账 | `_ocrstat.py` | 45px 内有槽位 **135/136 = 99%**；号 完全对 86 / 整串读错 26 / 空 14 / 截断 7；名 完全对 53 / 空 40 / 整串读错 25 / 截断 15 | 几何几乎不缺，分丢在**字符串**上 |\n| 4 | 截断是不是框切了字 | `_ocrstat.py` + `_pincropgt.py` | `39→3` 框宽 **24px**、`113→13` **34px**、`115→15` **35px**（都够装） | **是 CRNN 少读一个字符**，不是检测 |\n| 5 | **读法全对的写实上界** | `_ocroracle.py` | 官方 9 张 **58.6304 → 61.2888（名全对）→ 63.2307（号+名全对）= +4.6003**；tp 引脚 37→52 | **动权重之前先看这个数** |\n| 6 | 模型现状 | `vlm/client.py:4`、`_flowpatch.py:20` | CRNN 真值紧框 **0.843** / stage1 紧框 **0.197** / 外扩 +3 → **0.654** | 瓶颈在**裁剪**，不在权重 |\n| 7 | ⛔ 把引脚点吸附回框边 | `_pinsnap.py --split 10GT` | T0 原样 **28** → T1/T2/T4 = **0**、T3 外扩 8 才 15、T5 最优 (1,1) = 29 | **官方档也判负**，不用实现 |\n| 8 | ⛔「GT 点 = 文字框心」「点在框边线上」 | `_pintext.py` | 号框心 7.4% / 名框心 **0.0%** / 中点 1.6%；落在 bbox 边线 **0%**（到边线 p50 12px） | 两个假说都**证伪**；真实形态是「框边往外每边一个固定桩距」 |\n| 9 | ⛔ **关掉 `BOX_PIN_NEED_NAME` 去收那 23 根** | `_gateab.py` + `stage2_eval.py` | **官方 9 张 52.6510 → 52.4987（−0.15）**、`name_mismatch` 16→41、tp **没多**；**全量 220 反而 +0.10**（26.0962 → 26.1978） | **闸门保护的是精度**，效果还**分档相关**；要补的是**名字** |\n\n**★ 第十批的根因链（官方 9 张，交付产物 `work\\_fast_out_reg9`）**\n\n- 引脚分项 `tp 37 / fp 38 / fn 83`；`pin.missing 51`、`name_mismatch 16`、`position_mismatch 16`。\n- **GT 的 IC(box) 引脚 120 根，我们只发出 75 根**（缺 45）：\n  - **23 根是「号已经读对了，但名字没读到 ⇒ `stage2/assemble.py:759` 的 `BOX_PIN_NEED_NAME`（默认开）整条不发」**\n    —— 但**关掉它并不赚**（见上表第 9 行）：名字只能回退成引脚号，官方档的 GT 引脚名\n    86.5% 是真信号名 ⇒ 多发出来的引脚全变 fp；\n  - 22 根是号读错（`113→13`、`39→3`、`48→46`、`68→88`）；\n  - 6 根是附近 45px 内没有任何号槽位。\n- 「读法全对」的上界：**+4.60**（名 +2.66、号再 +1.94），前提是 IC 的 75 根预测引脚里\n  **点已对 54 根（72%）**、点没对 21 根 —— **点没对的那些，识别再准也拿不到**。\n- 训练集 `textrec\\data\\manifest.jsonl` **388518 条 = 合成 381876 + 真实 6642**，\n  而真实那份 `split=\"real\"` **只验证、绝不训练**（`textrec\\manifest.py:32`）；\n  真实 val（785 条、batch 256 + 截断解码）exact **0.6866 / 位号 0.8850**；混训要显式 `--include-real`。\n\n**★ 第十批的方法学**\n\n1. **动权重之前先算天花板。** `_ocroracle.py` 给的是「这条路**全部**能值多少」（+4.60），\n   先有它，才谈得上「重训值不值」。上界不是承诺，但它是**投入的上限**。\n2. **按位置查，不要按号查。** 同一批缺号：按号查只能找到 94/136（读错的被算成「没槽位」），\n   按位置查是 135/136 ⇒ 几何不缺。**绑定方式换了，结论就换了。**\n3. **把「读错 / 没产出 / 没检测到」分成三笔账再决定投哪** —— 但**分完账不要顺手宣布\n   「改一行开关就能拿回来」**：那 23 根就是反例（第 9 行）。**「归到哪一类」和\n   「关掉哪个开关」是两个命题，后一个必须单独 A/B。**\n4. **A/B 的臂要先证明它和基线不一样。** `_vlmab2.py` 的 `\"pins\"` 臂 `pin=True` 根本没设\n   ⇒ 等于「拿基线比基线」。凡是量新通道，先让脚本把每臂的开关 `print` 出来。\n5. **能离线做的 A/B 就别占卡。** `assemble.build_doc(stage1, assigned, case)` 的两个输入\n   都在盘上、装配开关是模块级全局 ⇒ `_gateab.py` 改一行全局就能切，\n   **纯 CPU、秒级、可以和长跑并行**（本轮就是在全量 220 的 VLM 阶段同时跑完的）。\n6. **开关的效果可能分档相关。** 同一个 `BOX_PIN_NEED_NAME=0`：官方 9 张 **−0.15**、\n   全量 220 **+0.10**（派生档的引脚名常是数字）。**只在一档上量会得出相反的结论。**\n\n**★ 第十一批：引脚通道端到端 ——「写进产物」不等于「有人读」**\n\n第十批把缺口拆到根数、并量出「读法全对只值 +4.60」。这一批去拿那 23 根\n（号读对、名字没读到的），结论是：**通道早就写对了，是融合层根本没读** ——\n把「没人读」这个真 bug 修掉，官方 9 张 **58.6304 → 61.5112（+2.88）**。\n\n| # | 查了什么 | 文件 · 工具 | 量出来的结果 | 结论 |\n|---|---|---|---|---|\n| 1 | VLM 引脚通道到底写出了什么 | `vlm/enrich.py`、`work\\_vlm_pinfix_full\\1.json` | 补强文档里 `pins[cid][slot][\"number\"]` **恒为 `None`**，号**只活在键名** `pin_<号>` 里、名在 `pinname`；`VLM_PIN_CHANNEL=1` 把号/名写进 `pins`（case 1 的 `U1` 21 个槽位，`pin_17 GND / pin_115 VDDC / pin_122 VDD`） | 数据**确实写进去了** |\n| 2 | 写进文档 = 进得了交付吗 | doc 级 `stage2_eval` vs 融合级 `fusion.run`，**同一份产物** | doc 级 **60.7776** vs 融合级 **58.6304 = 与基线逐位相同**；根因：`fusion/claims.py:450 _add_vlm()` **只吃 `vlm[\"components\"]`**，引脚是 `stage2/assemble.py:588 build_doc()` 用 `stage1`+`stage2/_assigned` **重新装配**的 | **「写进了产物」≠「有人读」** —— 这是真 bug，不是通道无效 |\n| 3 | （中途 confound）拿错文档比 | `FUSION_VLM_DIR=work\\_vlm_pinfix` 得 **53.7317** | 那是 `_vlmab2` 的臂**没开 value/name 通道**（comp F1 掉回 0.8031） | **A/B 必须叠在同一份「交付自己的」文档上** |\n| 4 | 修掉之后值多少 | `claims.py` (d) 段：点最近邻 **3px** 定槽位、`FUSION_VLM_PIN_SCORE=1.15`、`_pin_channel` 出处标记 | 官方 9 张 **58.6304 → 61.5112 = +2.88**；pin F1 0.3920→**0.4858**（tp 37→**45**、fp 38→31、fn 83→75）、netH 0.5355→**0.5493**、netL 0.1876→0.1930；失配 `pin.extra` **6→1**、`name_mismatch` 16→11、`missing` 51→45 | 引脚通道**真能赚**；`FUSION_VLM_PIN_SCORE` 在 0.90/1.30/1.60/2.50 四档**逐位相同**（槽位没有别的候选）⇒ 不用调 |\n| 5 | 号与名各值多少 | `FUSION_VLM_PIN_NUM` / `_NAME` 四臂 | 只补号 **60.5816（+1.951，九张没有一张变差）** / 只补名 **59.9468（+1.316）** / 全开 **61.5112（+2.881）** / 空跑 **58.6304（0.000，逐位相同）** | **两半之和 ≠ 全开**：号赢 case 1/2/9、名赢 3/5/10，**case 9 全开只 +4.84 而只号 +9.39（名倒扣 4.55）** |\n| 6 | GT 引脚键约定到底怎么定（**更正第十批第 1 行**） | `_pinconv.py` 全 split 普查 | 官方 10GT **21 个 IC 里 20 个（95.2%）的键就是 1..N**、IC `pinname` 纯数字 **0.0%**（唯一例外 `10GT/1/U1` n=26 物理号）；派生 `200_train_cases` 946 个 IC 只有 **22.6%** 顺序键、**50.9% 的引脚键 >8**、`pinname` 纯数字 **20.1%** | **官方档号小、缺名字；派生档号大、名字常是号** ⇒ 通道该不该开**按档定** |\n| 7 | 全量 220 张上开不开 | 同口径 A/B（各 220 张、3 worker、~29 min） | **29.4819 → 29.4099（−0.072）**；按 split 拆开是**三档**：官方 `10GT` 10 张 **+2.59**、`10_GTcase` 10 张 **+0.76**、`200_train_cases` 200 张 **−0.25**（全量 42 张变好 / 63 张变差；最差 `0105 −12.11`、最好 `0036` +7.62） | **只亏在自动命名的那 200 张**（自证），两个 `10GT*` 集子都赚 |\n\n**★ 第十一批的方法学**\n\n7. **「写进了产物」不等于「有人读」。** 同一份产物跑两条口径（doc 级 / 交付级），\n   差值就是「没人读」的量。凡是新写一个产物字段，**先问谁读它**。\n8. **一条通道的两半要拆开各量一次。** 全开 +2.88 里号值 +1.95、名值 +1.32，\n   但**两半之和 ≠ 全开**（名会覆盖「号纠正后本该跟着变」的名）⇒ 只有 2×2 四臂\n   才看得出「只补号零回归」这条路；**空跑臂是必要的对照**（证明旋钮真的在起作用）。\n9. **默认值按档定，不按均分定。** 同一个通道官方 `10GT` **+2.88**、`10_GTcase` **+0.76**、\n   `200_train_cases` **−0.25**（220 张合计才 −0.07）⇒ 「谁开」比「开不开」更重要；\n   而且 `200_train_cases` 自建的 GT 是**自证**的，别拿它当判据。\n10. **平均分会把方向不同的档抵消掉。** 220 张合计 −0.07 里同时藏着 +2.59（10 张）与\n   −0.25（200 张）。**报均分前先按 split 拆一次**，否则结论会被最大那一档的权重决定。\n\n---\n\n**★ 第九批：全量 220 的阶段级归因 —— 分到底丢在哪一段**\n\n第一次把 220 张按**阶段**摊开看，而不是只看总分。结论：**引脚 + 网络占 60% 权重、\n共用同一个根因（IC 引脚我们没有）**，而位号（元件分）根本不是最大的洞。\n\n| # | 改了什么 / 查了什么 | 文件 · 工具 | 量出来的结果 | 结论 |\n|---|---|---|---|---|\n| 1 | **stage1 色相询问有界化**：先缩到最大边 1024，独立超时 30 s，连续失败 3 次熔断 | `stage1/wires.py` | `0003` 单张 **315.73 s → 8.3 s**；220 张 stage1 **416.5 s** | 采纳（默认仍是 `hint`） |\n| 2 | 按**官方权重**算可回收空间 | `schematic_parser/metrics.py:11` | 网络 **+27.9** ＞ 引脚 **+23.1** ＞ 元件 +11.4 ＞ 导线 +9.7 | 先修引脚/网络 |\n| 3 | **上帝键实验**（位号按中心距强行配对正确） | `_keyoracle.py --n 60` | 21.53→**27.19**，但**引脚只 +0.0112**、元件 +0.1310（那是强行配对的作弊分） | **否掉「是位号/键的问题」** |\n| 4 | 放宽 `pin_name` 到框外（第一版，仍在引脚号**之前**跑） | `stage2/assign.py` | 19 张 **30.81 → 30.09**（引脚 0.1987→0.1756、tp 44→42） | **判负** |\n| 5 | 改成 **late pass**：引脚号那一轮跑完再补空名字槽 | `stage2/assign.py` | 合成自检 **15 项**两种开关状态都过；真实 A/B 待显存 | 采纳（`STAGE2_PINNAME_OUTSIDE` 默认 **0** = 关） |\n| 6 | `_patch9`/`_wfhead`/`_wfkind` 等工装的**同名两份**坑 | `docs/DIAGNOSTICS.md` | 改一份、重建后输出字节数一模一样 | 已写成纪律 |\n\n**★ 第九批的根因链（硬数据，全在 10/6 的 CV-only 产物上量）**\n\n- GT 的 IC 引脚名 **86.5% 是真信号名**（`CS / D1/DO / CLK / IOVDD / XTAL2`），纯数字只 13.5%。\n- 我们产出的引脚里 **78.2% 的 `pinname` 就是引脚号本身**（回退点 `assemble.py:761 nm = r['nm'] or num`）。\n- GT 引脚 `point` **100% 在元件 bbox 之外**（中位 9 px / p90 35 px / p99 67 px）。\n- 2220 根 GT IC 引脚里 **64.9% 在配对上的元件键下一根都没有**；能比的 780 根里名字逐字符相等只 **3.1%**。\n- ⇒ **位号全修对也救不回引脚**（上帝键只值 +0.0112）。要动的是**引脚检出率 + 名字读出**。\n\n**★ 第九批的方法学（比上表更值钱）**\n\n1. **「慢」先量余额，再上 profiler，最后才怀疑硬件。** `total_s` 减去 `timing` 里各段之和，\n   差额只可能来自**进程外**。这一条免费；一次 cProfile（`work/tools/diag/_prof1.py 0003`）\n   就落到 `wires.py:230 → vlm/client.py:161 → urlopen → socket.recv_into` 的 303.4 s。\n2. **任何发到进程外的调用都要自带超时、上界与熔断，失败必须计数。**\n   `ask()` 把一切异常吞成 `\"ERR:...\"` **字符串正常返回** ⇒ 失败不会以报错的形式出现，\n   只会以「这里有段时间不见了」的形式存在。全局 `VLM_TIMEOUT=600` + 重试 4 次 + **整张原图**\n   三处叠加，把一次「问个颜色」变成单张 315 s。\n3. **先用上帝视角量天花板，再决定动不动手。** 上帝键给出 +5.66，但拆开看引脚只占 +0.0112\n   ⇒ 花在位号绑定上的每一分钟都是在修一个**不是根因**的东西。\n4. **顺序就是优先级。** `pin_name` 排在 `pin_number` **之前**，而 `taken_box` 规定同一块文字\n   只能用一次 ⇒ 一旦放宽 `pin_name` 的取景范围，它先抢走文字、**引脚号被饿死**。\n   要放宽，只能改成**事后补空槽**（late pass），不能只改距离阈值。\n5. **负分候选上不能用除法做归一。** `score / (1 + d/20)` 在 `score < 0`（框外候选的常态）时\n   **越远的分越高**，实测把 `VDDIO` 与 `VSSA` 两个名字对调；换成 `score - 0.035*d`。\n\n---\n\n**★ 第八批：把 19 个「★要新写」逐个对账，并给 LLM 补上下文**\n\n19 个 `kind='new'` 徽标逐个读代码对账（不是信进度叙述）。结论：\n**16 个是「早就落地、只是徽标没改」**（`know` `pool` `solve` `plausible` `conflict` `llm_judge`\n`rescan` `iterate` `cropfix` `audit` `own` `ev_bridge` `pincol` `ownnum` `boxpinprior` `gtcheck`），\n**3 个是「量过、判负/证否」**（`fixstr` `batch` `boxscan`）—— 已全部去掉「要新写」徽标。\n\n| # | 改了什么 | 文件 | 量出来的结果 | 结论 |\n|---|---|---|---|---|\n| 1 | **LLM 上下文块**（类型 / 同件别的字段 / 邻近元件 / 已定位号 / 已判可疑，+ 要求回一句 `依据=`） | `fusion/llm_judge.py` | VLM 关时官方 9 张 **52.48 → 53.27（+0.79）** | 采纳，默认开 |\n| 2 | **整表裁决（contact sheet）真的被执行** | `fusion/llm_judge.py` | 4 张 **59.62 → 55.32（−1.07）**，且更慢（160.5 s vs 83.6 s） | **判负**，`SHEET_MIN=9999` 默认关 |\n| 3 | **交付口径三臂**：LLM 关 / LLM 开 / LLM 开+上下文 | `fusion/run.py` | 三个臂**全是 58.63 且逐位相同** | LLM 轮在交付口径下值 **0.00**，却要 **+1.8 h/220 张** |\n| 4 | `judge` / `rescan` 各自包 `try` | `fusion/run.py` | `judge` 一抛异常该 case 原本**一份融合产物都没有** | 采纳 |\n| 5 | 收敛判据用**本轮结束**的题面（`FUSION_CONV_EXACT=1`） | `fusion/run.py` | case 1 实为 `n_q_next 15`，旧判据看的是上一轮 | 采纳 |\n| 6 | 位号取景框取**最高分**那个（`FUSION_REGION_TOPK=1`） | `fusion/claims.py` | `stage2` 从不保证 `desig_slots` 按分降序 | 采纳 |\n| 7 | `solve.gap_fill` 的负分跳过**留计数** | `fusion/solve.py` | 原为静默 `continue` | 采纳（只加计数） |\n\n**★ 第八批的方法学（比上表更值钱）**\n\n1. **「开关开着」不等于「这条路被执行过」。** `SHEET_ON` 默认 `1`、`_sheet_image` /\n   `_known_designators` / `judge_sheet` 全是为整表写的，**但入口是\n   `if mode == \"sheet\" and SHEET_ON:`，而 `MODE` 默认 `\"auto\"`** ⇒ 那条路一次都没跑过。\n   「没有上下文环境」这句话因此有了代码级坐标。**默认值 ≠ 生效值**：双开关（允许 + 选择）\n   两个都要看。尺子：`python tools/diag/_jrep.py --out <产物目录> [--rows]`。\n2. **提示词改动必须回读「模型到底收到了什么」。** 分不变也可能是真的生效了。\n   `ctx=1` 时 **12/12 行都有 `依据=…`**，`ctx=0` 时 **0/12**。只报分数说不清为什么变，\n   只报 `why` 说不清值不值 —— **两样都要**。\n3. **「LLM 有没有用」必须先给它上下文，再问。** 本轮第一次给出有前提的答案：\n   在 VLM `auto` 的交付口径下，整个 LLM 轮 **+0.00**（三臂逐位相同）；在 VLM 关时 **+0.79**。\n   ⇒ 它是在**没有 VLM** 时的补强，不是交付口径的增量。\n4. **审计报告里的「这里有个 bug」四个字不等于这里真有 bug。** 一份审计说\n   `claims.py` 的 `pinpts.get(cid)` 与 `doc[\"pins\"]` 的键对不上；实测\n   `_pinbox.py`：融合读的是 **stage1** 文档，`pins` 按 `cid` 记（case 1 = 22/22/22 全中），\n   按**位号**记键的是 **stage2** 文档 —— 审计把两份文档搞混了，\n   照它改**反而会引入 bug**。**复现不出来就不是 bug。**\n5. **一个「零效果」的改动，先问它有没有可赢空间。** `own.assign` 端到端逐位相同，\n   因为一对一不变式**改造前就成立**；官方 9 张 124 颗里失配 20 颗，而其中只有\n   **1 颗**的候选池里有正确读法。先量天花板，再决定动不动手。\n\n---\n\n**★ 第七批（本会话后续）**\n\n**交付口径成绩：官方 `10GT` 9 张 44.16 → 58.63、派生 19 张 34.69 → 36.35**\n（`tools/eval/fast.py`，不加 `--no-vlm`、不设任何 `$env:` ⇒ VLM `auto` + `-fusion on` + `-mode off`）。\n\n| # | 改了什么 | 文件 | 官方 9 | 派生 19 | 结论 |\n|---|---|---|---|---|---|\n| 5 | 引脚号裁片**描边剔除**（绿色 no-connect 叉与数字同框被读成 `K4`/`L14`） | `stage2/text.py` | 56.71 → **57.54** | 35.39 → **35.75** | 采纳，只对 `pin_number,pin_name` |\n| 6 | 导线端点**同网吸附**（`STAGE2_EDGE_SNAP=20`，只吸近似垂直的邻居） | `stage2/assemble.py` | 57.54 → **58.63** | 35.75 → **36.35** | 采纳，增量全在 netL |\n| 7 | 形状惩罚真的改分（`FUSION_SHAPE_W`） | `fusion/priors.py` | 0 | −0.57 | **判负**，默认回 0.0 |\n| 8 | boxscan（给零候选元件建框去问一遍） | `fusion/claims.py` | −0.01 | +0.05 | **判负**，默认回 0 |\n| 9 | `own.assign` 全局一对一归属（`STAGE2_OWN_ASSIGN`） | `stage2/assign.py` | 0 | 0 | **零效果**，默认 0 |\n| 10 | GND 系引脚并成一条网 | — | — | — | **证伪**（官方 GT 不这么编码） |\n\n**★ 第七批的方法学（比上表更值钱）**\n1. **「A/B 有差别」不等于「你改的那条分支生效了」。** boxscan 第一版实测有差，\n   但把 `_fusion_report.json` 的 `notes` 打出来才看到每张只建了 1 个槽位 ——\n   分差是那 1 颗元件的读数对错，不是 boxscan 整体的效果。改完先证明分支执行了、\n   执行了几次，再解释分差。\n2. **对照臂必须配对口径。** boxscan 在 VLM 开着时基本是 no-op\n   （`_add_vlm` 已把 `comp.<cid>.key` 覆盖到 82/83、12/12、22/22），只能在\n   `--no-vlm` + `FUSION_LLM=1` 这个口径量；交付口径的 58.63 / 36.35 是另一张表。\n3. **归属类改动可能先天没有空间。** `own.assign` 端到端两档**逐位相同**，\n   因为 `owned` 本来就是一份划分 —— 一对一不变式**改造前就成立**。\n   先量天花板（`tools/diag/_ownasgn.py --headroom --gt`：官方 9 张 124 颗里\n   读对 104 / 空 11 / 错 9，而这 20 颗失配里只有 **1 颗**的候选池里已有正确读法），\n   再决定要不要改。\n4. **一个数字可以在两种跑法下不同。** 曾出现同参数下 9 张单跑 51.06 vs\n   19 张合跑的子集 51.74（差 <1 分）。**小于 ~1 分的差值采信前必须重复测量**\n   （本轮 `reg9` 与 `reg19` 印出的 10GT 子集已逐位一致）。\n5. **改默认值之前先看它有没有被执行。** `fusion/run.py` 的 `_fusion_report.json`\n   原先只在它自己的 `main()` 里落盘，而真实提交路径直接调 `run_case` ⇒\n   提交产物里**根本没有逐轮明细**。已在 `submission/run.py` 补上，并在\n   `fusion/run.py` 的 `rep` 里加了 `notes`。\n\n---\n\n**★ 第六批（本会话 2026-10-07）的四项改动与一条方法学**\n\n本会话把官方 `10GT` 的 9 张从 **44.16 拉到 56.71（+12.55）**，派生 19 张 34.77 → 35.39。\n四次改动全部落在**证据层与归属层**，方向是一致的：**用「形状/拓扑关系」替换「距离」当闸门。**\n\n| # | 改了什么 | 文件 | 官方 9 | 派生 19 |\n|---|---|---|---|---|\n| 1 | 稀疏封装引脚号不再被位置先验覆盖（`FUSION_BOX_PIN_PRIOR=0`） | `fusion/priors.py` | 44.16 → **53.41** | — |\n| 2 | 并网改看「端点微越过 + 不平行」（规则 5，`STAGE1_WIRE_OVER=12`，`WIRE_TOL` 回退 1.5） | `stage1/labels.py` · `stage1/nets.py` | 55.73 → **56.31** | 34.69 → **35.23** |\n| 3 | 文字归属改量「框到框」而不是「文字中心到框」（`STAGE2_OWN_BBOX=1`） | `stage2/assign.py` | 56.31 → **56.45** | 34.69 → **35.28** |\n| 4 | 引脚号候选的沿边衰减加快（`STAGE2_PINNUM_DECAY` 20 → 10） | `stage2/assign.py` | 56.45 → **56.71** | 35.28 → **35.39** |\n\n**★ 方法学（本会话踩出来的，比上面四条更值钱）**\n1. **`--no-vlm` 值 5.2 分。** 同一份代码、只差一个开关，均值 29.93 vs 24.73；`component_f1`\n   0.6483 vs 0.5260。**两批实验绝对不能同表比**。凡报数字先写清 VLM 是开是关。\n2. **共用输出目录会让诊断漂移。** `work/_fast_out` 每次跑都被覆盖，同一条命令隔一次跑就能得到\n   57 与 60 两个「未匹配元件数」。现在一律用 `fast.py --out <名>` 起独立目录。\n3. **自造的 GT 会骗你。** `10GT`（竞赛格式）box 键对上 **21/21 = 100%**；派生 `200_train_cases`\n   按画图工具是 `jlc` 46.6% / `Altium` 35.3% / `Datasheet` **21.2%** / `other` **7.3%**。\n   594 个未对上的 box 里 **80.3% 数学上不可赢**（占位符 294 · GT 里压根没这个键 183）。\n   在派生档上追分 = 对着噪声调参。详见 `reports/GT保真度与位号上限.md` 与「GT 保真度检查」节点。\n\n---\n\n**用户 m23186 的架构批评（本轮任务的直接来源）**：『你要坚持把整个大局做出来才能得到显著的性能增益……你要核对一下你现在用了什么算法什么思路，以及总的流程，所有的业务逻辑到底是怎么样的。』\n\n**★ 第五批审计的三条硬结论**\n1. **LLM 确实在引导重新框选与重新识别 —— 但它被默认配置关掉了。**\n   唯一一处是 `fusion/cropfix.py`（LLM 定方向 → 阶梯扩框 → 裁新图 → LLM 重读 → 自洽性采纳）。\n   而 `submission/run.py:356-357` 在默认 `-fusion on` 时把 `FUSION_CROPFIX` 与 `FUSION_LLM` 都置 `0`\n   ⇒ **交上去的那一份里融合层的 LLM 轮一次都没跑**。220 张上 `-fusion on`（无 LLM 轮）= 28.4200，\n   与不融合的 VLM 补强 28.4133 只差 **+0.007** —— 这就是「略微上升所以看不出价值」的原因。\n2. **LLM 能输出自己的读数**：`vlm:judge 1.5` / `vlm:cropfix 1.25` / `vlm:audit 1.30` / `vlm:fix 1.25` /\n   `vlm:rescan 1.2` / `vlm:enrich 1.15`，**全部以候选身份回池，没有一条直接改文档**（这是对的，别改）。\n3. **有两块「写了但不通」**：`doc.apply` 只认 `comp.*.key/value/partname` ⇒ **`pin.*` 与 `netlabel.*` 的裁决进不了交付文档**；\n   `stage2/assemble.py` 的 `num_of` 没导出 ⇒ 引脚号连映射回去都做不了。两块都画在下面对应节点的【第五批·审计】里。\n\n**★ 生产链的实测事实**：`_submit_out220r36` 的 `stage2` = `stage3` = `final_results` **逐字节相同**（MD5 `28F99796`）= **25.9861**；\n带 VLM 补强的 `work\\_fusion_vlm` = **28.4133**。**同一份 stage2，补强 +2.43 分，生产链没交。**\n\n\n---\n\n**★★ 第六批（本会话）在 `note` 顶部，此处以下为历史批次记录。**\n",

const FP = (function(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0;
                        return h.toString(36); })(JSON.stringify(BASE));
const LSKEY = 'eda_flow_v1:' + FP;
let G = load();
let sel = null;            // {type:'node'|'link', id}
let view = {x:40, y:20, k:0.78};
let dragNode = null, dragLink = null, panning = null;

function load(){
  try{
    // 清掉所有旧指纹的存盘，免得它们继续被误读
    for(let i=localStorage.length-1;i>=0;i--){
      const k = localStorage.key(i);
      if(k && k.indexOf('eda_flow_v1')===0 && k!==LSKEY) localStorage.removeItem(k);
    }
    const s = localStorage.getItem(LSKEY);
    if(s) return JSON.parse(s);
  }catch(e){}
  return JSON.parse(JSON.stringify(BASE));
}
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(G)); }catch(e){} }
function resetAll(){
  if(!confirm('丢弃所有改动，还原成这个文件的基线（'+ (BASE.name||'') +'）？')) return;
  try{ localStorage.removeItem(LSKEY); }catch(e){}
  G = JSON.parse(JSON.stringify(BASE));
  sel = null; renderAll(); fit();
}
const groupById = id => (G.groups.find(g=>g.id===id)||{color:'#8b949e',title:id});
const nodeById  = id => G.nodes.find(n=>n.id===id);

/* ---------- 渲染 ---------- */
function renderAll(){ renderNodes(); renderLinks(); renderPalette(); renderList(); renderInsp(); renderStat(); save(); }

function renderStat(){
  const d = diff();
  document.getElementById('gname').textContent = G.name || '';
  document.getElementById('stat').textContent =
    G.score!=null ? ('基线 '+G.score+' ｜ ') : '';
  const parts = [];
  if(d.addNodes.length)   parts.push('+'+d.addNodes.length+' 节点');
  if(d.delNodes.length)   parts.push('−'+d.delNodes.length+' 节点');
  if(d.addLinks.length)   parts.push('+'+d.addLinks.length+' 连线');
  if(d.delLinks.length)   parts.push('−'+d.delLinks.length+' 连线');
  document.getElementById('stat').textContent += parts.length ? ('已改：'+parts.join(' ')) : '未改动';
}

function rich(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function md(s){
  return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')
               .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function renderNodes(){
  const box = document.getElementById('nodes');
  box.innerHTML = '';
  for(const n of G.nodes){
    const g = groupById(n.group);
    const el = document.createElement('div');
    el.className = 'node' + (sel && sel.type==='node' && sel.id===n.id ? ' sel':'');
    el.id = 'nd_'+n.id;
    el.style.cssText = 'left:'+n.x+'px;top:'+n.y+'px;width:'+(n.w||210)+'px';
    const ins  = (n.ins||[]), outs = (n.outs||[]);
    const kc = {exec:'#3fb950',param:'#d29922',data:'#58a6ff',new:'#f85149',cand:'#f85149',dead:'#6e7681'}[n.kind]||'#8b949e';
    const kn = {exec:'现在有',param:'标尺',data:'数据',new:'★要新写',cand:'候选',dead:'停用'}[n.kind]||n.kind;
    let h = '<div class="hd" style="border-left-color:'+g.color+'">'
      + '<span class="kbadge" style="color:'+kc+';border-color:'+kc+'">'+kn+'</span>'
      + '<span>'+esc(n.title)+'</span></div><div class="bd">';
    if(n.sub) h += '<div class="sub">'+esc(n.sub)+'</div>';
    if(n.bullets && n.bullets.length)
      h += '<ul class="bul">' + n.bullets.map(b=>'<li>'+rich(b)+'</li>').join('') + '</ul>';
    h += '<div class="ports"><div class="col in">'
      + ins.map(p=>'<div class="port in" data-node="'+n.id+'" data-port="'+p.id+'" data-dir="in">'
          + '<span class="dot"></span><span class="t">'+esc(p.label||p.id)+'</span></div>').join('')
      + '</div><div class="col out">'
      + outs.map(p=>'<div class="port out" data-node="'+n.id+'" data-port="'+p.id+'" data-dir="out">'
          + '<span class="t">'+esc(p.label||p.id)+'</span><span class="dot"></span></div>').join('')
      + '</div></div>';
    if(n.params && n.params.length)
      h += '<div class="params">' + n.params.map(p=>'<span class="prm">'+esc(p[0])+'='+esc(p[1])+'</span>').join('') + '</div>';
    h += '</div>';
    el.innerHTML = h;
    box.appendChild(el);
  }
  applyView();
  bindNodeEvents();
}

function renderLinks(){
  const svg = document.getElementById('links');
  let s = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" '
        + 'markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5b6d"/></marker></defs>';
  for(const L of G.links){
    const a = portPos(L.from, 'out'), b = portPos(L.to, 'in');
    if(!a || !b) continue;
    const d = curve(a,b);
    const col = L.kind==='ctrl' ? '#d29922' : '#4a5b6d';
    const isSel = sel && sel.type==='link' && sel.id === linkId(L);
    s += '<path class="hit" data-link="'+linkId(L)+'" d="'+d+'"></path>';
    s += '<path class="wire'+(isSel?' sel':'')+'" d="'+d+'" stroke="'+col+'" marker-end="url(#ah)"></path>';
  }
  svg.innerHTML = s;
  svg.querySelectorAll('path.hit').forEach(p=>{
    p.onclick = ev=>{ ev.stopPropagation(); sel={type:'link', id:p.dataset.link}; renderAll(); };
  });
}

function curve(a,b){
  const dx = Math.max(38, Math.abs(b.x-a.x)*0.5);
  return 'M'+a.x+','+a.y+' C'+(a.x+dx)+','+a.y+' '+(b.x-dx)+','+b.y+' '+b.x+','+b.y;
}

function portPos(ref, dir){
  const [nid, pid] = ref.split('.');
  const el = document.querySelector('.port[data-node="'+nid+'"][data-port="'+pid+'"]');
  const n = nodeById(nid);
  if(!el || !n) return null;
  return {x: n.x + (dir==='out' ? (n.w||210) : 0), y: n.y + el.offsetTop + el.offsetHeight/2};
}

function renderPalette(){
  const box = document.getElementById('palette');
  const kinds = [['exec','现在就有'],['new','★ 要新写'],['param','标尺/参数'],
                 ['data','数据产物'],['dead','已停用']];
  box.innerHTML = kinds.map(([k,label])=>{
    const c = {exec:'#3fb950',param:'#d29922',data:'#58a6ff',new:'#f85149',dead:'#6e7681'}[k];
    return '<div class="pitem" onclick="addNode(\''+k+'\')">'
      + '<span class="dotc" style="background:'+c+'"></span>'+label+'</div>';
  }).join('')
  + '<div class="pitem" onclick="addFromList()" style="margin-top:6px;color:#58a6ff">'
  + '＋ 从已有候选节点里加</div>';
}

function renderList(){
  const ul = document.getElementById('nlist');
  ul.innerHTML = G.nodes.map(n=>{
    const c = groupById(n.group).color;
    return '<li onmouseenter="hl(\''+n.id+'\',1)" onmouseleave="hl(\''+n.id+'\',0)" '
      + 'onclick="sel={type:\'node\',id:\''+n.id+'\'};renderAll();focusNode(\''+n.id+'\')">'
      + '<span style="color:'+c+'">■</span> '+esc(n.title)+'</li>';
  }).join('');
}
function hl(id,on){ const e=document.getElementById('nd_'+id); if(e) e.style.outline = on?'2px solid #58a6ff':''; }

let MODE = 'read';
function toggleMode(){
  MODE = MODE==='read' ? 'edit' : 'read';
  const b = document.getElementById('mbtn');
  if(b){ b.textContent = MODE==='read' ? '✎ 编辑' : '👁 阅读'; b.className = MODE==='read'?'pri':''; }
  renderInsp();
}
const KIND_ZH = {exec:'现在有',param:'标尺',data:'数据',new:'★要新写',cand:'候选',dead:'停用'};
const KIND_C  = {exec:'#3fb950',param:'#d29922',data:'#58a6ff',new:'#f85149',cand:'#f85149',dead:'#6e7681'};
function renderInsp(){ return MODE==='read' ? renderRead() : renderEdit(); }
function renderRead(){
  const box = document.getElementById('insp');
  if(!sel){ box.innerHTML = '<div class="empty">点一个节点看它的<b>完整说明</b>（要点 + 详细记录）。<br><br>'
    + '顶部「✎ 编辑」切到编辑态：拖节点、拖圆点连线、按 Delete 删除；'
    + '改完点「改动说明」把变更贴回给我，我按新流程改代码。</div>'; return; }
  if(sel.type==='link'){
    const L = G.links.find(x=>linkId(x)===sel.id);
    if(!L){ sel=null; return renderRead(); }
    box.innerHTML = '<div class="rd"><h4 style="margin-top:2px">连线</h4>'
      + '<div class="rt" style="border-left-color:#4a5b6d">'+esc(L.from)+' → '+esc(L.to)+'</div>'
      + '<div class="rmeta"><span class="tag">'+esc(L.kind)+'</span></div>'
      + '<div class="rnote">data = 数据流（一条记录往下传）\nctrl = 控制面（预算/开关决定对面跑不跑）</div></div>';
    return;
  }
  const n = nodeById(sel.id); if(!n){ sel=null; return renderRead(); }
  const g = groupById(n.group);
  const kc = KIND_C[n.kind]||'#8b949e', kn = KIND_ZH[n.kind]||n.kind;
  const ins = n.ins||[], outs = n.outs||[], par = n.params||[], bl = n.bullets||[];
  let h = '<div class="rd">';
  h += '<h4 style="margin-top:2px">'+esc(n.id)+'</h4>';
  h += '<div class="rt" style="border-left-color:'+g.color+'">'+esc(n.title)+'</div>';
  h += '<div class="rmeta"><span class="kbadge" style="color:'+kc+';border-color:'+kc+'">'+kn+'</span>'
     + '<span class="tag">'+esc(g.title)+'</span></div>';
  if(n.sub) h += '<div class="rsub">'+esc(n.sub)+'</div>';
  if(n.file) h += '<div class="rfile">'+esc(n.file)+'</div>';
  if(ins.length || outs.length){
    h += '<div class="rsec">端口</div><div class="rports">'
      + (ins.length ? '<div><span class="lab">入 </span>'+ins.map(p=>'<i>'+esc(p.label||p.id)+'</i>').join('')+'</div>' : '')
      + (outs.length? '<div><span class="lab">出 </span>'+outs.map(p=>'<i>'+esc(p.label||p.id)+'</i>').join('')+'</div>' : '')
      + '</div>';
  }
  if(par.length){
    h += '<div class="rsec">参数（'+par.length+'）</div><div class="rpar">'
      + par.map(p=>'<div class="rp"><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></div>').join('') + '</div>';
  }
  if(bl.length){
    h += '<div class="rsec">要点清单（'+bl.length+'）</div><ul class="rbul">'
      + bl.map(b=>'<li>'+md(b)+'</li>').join('') + '</ul>';
  }
  if(n.note) h += '<div class="rsec">详细记录</div><div class="rnote">'+md(n.note)+'</div>';
  h += '</div>';
  box.innerHTML = h;
}
function renderEdit(){
  const box = document.getElementById('insp');
  if(!sel){ box.innerHTML = '<div class="empty">点一个节点或一条连线看详情。</div>'; return; }
  if(sel.type==='link'){
    const L = G.links.find(x=>linkId(x)===sel.id);
    if(!L){ sel=null; return renderInsp(); }
    box.innerHTML = '<h4>连线</h4>'
      + '<div class="row"><span>从</span><input value="'+esc(L.from)+'" oninput="setLink(\'from\',this.value)"></div>'
      + '<div class="row"><span>到</span><input value="'+esc(L.to)+'" oninput="setLink(\'to\',this.value)"></div>'
      + '<div class="row"><span>类型</span><select onchange="setLink(\'kind\',this.value)">'
      + ['data','ctrl'].map(k=>'<option value="'+k+'"'+(L.kind===k?' selected':'')+'>'+k+'</option>').join('')
      + '</select></div>'
      + '<button onclick="delLink()">删除这条连线</button>';
    return;
  }
  const n = nodeById(sel.id); if(!n){ sel=null; return renderEdit(); }
  const gs = G.groups.map(g=>'<option value="'+g.id+'"'+(n.group===g.id?' selected':'')+'>'+esc(g.title)+'</option>').join('');
  const ks = ['exec','new','param','data','dead'];
  box.innerHTML = '<h4>节点</h4>'
    + f('标题','title',n.title) + f('副标题','sub',n.sub||'')
    + '<div class="row"><span>种类</span><select onchange="setNode(\'kind\',this.value)">'
      + ks.map(k=>'<option value="'+k+'"'+(n.kind===k?' selected':'')+'>'+k+'</option>').join('') + '</select></div>'
    + '<div class="row"><span>分组</span><select onchange="setNode(\'group\',this.value)">'+gs+'</select></div>'
    + f('代码位置','file',n.file||'')
    + '<div class="row"><span>说明</span><textarea oninput="setNode(\'note\',this.value)">'+esc(n.note||'')+'</textarea></div>'
    + '<div class="row"><span>要点清单（每行一条，**粗体**，画在节点正面）</span>'
      + '<textarea style="min-height:130px" oninput="setBullets(this.value)">'+esc((n.bullets||[]).join('\n'))+'</textarea></div>'
    + '<h4>参数</h4><div id="prms"></div><button onclick="addParam()">＋ 参数</button>'
    + '<h4>端口</h4>'
    + '<div class="row"><span>输入（每行一个 id|标签）</span><textarea oninput="setPorts(\'ins\',this.value)">'
      + esc((n.ins||[]).map(p=>p.id+'|'+(p.label||'')).join('\n')) + '</textarea></div>'
    + '<div class="row"><span>输出</span><textarea oninput="setPorts(\'outs\',this.value)">'
      + esc((n.outs||[]).map(p=>p.id+'|'+(p.label||'')).join('\n')) + '</textarea></div>'
    + '<button onclick="delNode()" style="color:#f85149">删除这个节点</button>';
  const pb = document.getElementById('prms');
  pb.innerHTML = (n.params||[]).map((p,i)=>'<div class="kv">'
    + '<input value="'+esc(p[0])+'" oninput="setParam('+i+',0,this.value)">'
    + '<input value="'+esc(p[1])+'" oninput="setParam('+i+',1,this.value)">'
    + '<button onclick="delParam('+i+')">×</button></div>').join('') || '<div class="lab">无</div>';
}
function f(label,key,val){
  return '<div class="row"><span>'+label+'</span><input value="'+esc(val)+'" oninput="setNode(\''+key+'\',this.value)"></div>';
}
function setNode(k,v){ const n=nodeById(sel.id); if(n){ n[k]=v; renderNodes(); renderList(); save(); renderStat(); } }
function setBullets(v){ const n=nodeById(sel.id); if(n){ n.bullets=v.split('\n').map(s=>s.trim()).filter(Boolean); renderNodes(); save(); } }
function setPorts(k,v){
  const n=nodeById(sel.id); if(!n) return;
  n[k] = v.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{
    const i = s.indexOf('|'); return i<0 ? {id:s,label:s} : {id:s.slice(0,i).trim(),label:s.slice(i+1).trim()};
  });
  renderNodes(); renderLinks();
}
function setParam(i,j,v){ const n=nodeById(sel.id); if(n&&n.params&&n.params[i]){ n.params[i][j]=v; renderNodes(); save(); } }
function addParam(){ const n=nodeById(sel.id); if(!n) return; (n.params=n.params||[]).push(['键','值']); renderInsp(); renderNodes(); }
function delParam(i){ const n=nodeById(sel.id); if(n&&n.params){ n.params.splice(i,1); renderInsp(); renderNodes(); save(); } }
function setLink(k,v){ const L=G.links.find(x=>linkId(x)===sel.id); if(L){ L[k]=v; renderLinks(); save(); } }
function delLink(){ G.links = G.links.filter(x=>linkId(x)!==sel.id); sel=null; renderAll(); }
function delNode(){
  const id = sel.id;
  if(!confirm('删除节点「'+nodeById(id).title+'」及其所有连线？')) return;
  G.nodes = G.nodes.filter(n=>n.id!==id);
  G.links = G.links.filter(l=>l.from.split('.')[0]!==id && l.to.split('.')[0]!==id);
  sel=null; renderAll();
}
function linkId(L){ return L.from+'>'+L.to; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 交互 ---------- */
function applyView(){
  document.getElementById('world').style.transform =
    'translate('+view.x+'px,'+view.y+'px) scale('+view.k+')';
}
function bindNodeEvents(){
  document.querySelectorAll('.node').forEach(el=>{
    el.onclick = ev=>{ ev.stopPropagation(); sel={type:'node', id:el.id.slice(3)}; renderAll(); };
    el.querySelector('.hd').onmousedown = ev=>{
      ev.stopPropagation();
      const n = nodeById(el.id.slice(3));
      dragNode = {n, sx:ev.clientX, sy:ev.clientY, ox:n.x, oy:n.y};
      document.getElementById('canvas').classList.add('drag');
    };
  });
  document.querySelectorAll('.port .dot').forEach(d=>{
    d.onmousedown = ev=>{
      ev.stopPropagation(); ev.preventDefault();
      const p = d.parentElement;
      dragLink = {node:p.dataset.node, port:p.dataset.port, dir:p.dataset.dir,
                  x:ev.clientX, y:ev.clientY};
    };
    d.onmouseup = ev=>{
      if(!dragLink) return;
      ev.stopPropagation();
      const p = d.parentElement;
      finishLink(dragLink, {node:p.dataset.node, port:p.dataset.port, dir:p.dataset.dir});
    };
  });
}
function finishLink(a,b){
  dragLink = null;
  if(a.dir === b.dir) return;
  const from = a.dir==='out' ? a : b;
  const to   = a.dir==='out' ? b : a;
  const f = from.node+'.'+from.port, t = to.node+'.'+to.port;
  if(from.node === to.node) return;
  if(G.links.some(l=>l.from===f && l.to===t)) return;
  G.links.push({from:f, to:t, kind:'data'});
  renderLinks(); save(); renderStat();
}
const cv = document.getElementById('canvas');
cv.addEventListener('mousedown', ev=>{
  if(ev.target !== cv && !ev.target.closest('#world') ) return;
  if(ev.target.closest('.node') || ev.target.closest('path.hit')) return;
  sel = null; renderAll();
  panning = {sx:ev.clientX, sy:ev.clientY, ox:view.x, oy:view.y};
  cv.classList.add('drag');
});
window.addEventListener('mousemove', ev=>{
  if(dragNode){
    dragNode.n.x = dragNode.ox + (ev.clientX-dragNode.sx)/view.k;
    dragNode.n.y = dragNode.oy + (ev.clientY-dragNode.sy)/view.k;
    const el = document.getElementById('nd_'+dragNode.n.id);
    el.style.left = dragNode.n.x+'px'; el.style.top = dragNode.n.y+'px';
    renderLinks();
  } else if(panning){
    view.x = panning.ox + (ev.clientX-panning.sx);
    view.y = panning.oy + (ev.clientY-panning.sy);
    applyView();
  } else if(dragLink){
    drawTemp(ev);
  }
});
window.addEventListener('mouseup', ()=>{
  if(dragNode || panning){ save(); renderStat(); }
  dragNode = null; panning = null; dragLink = null;
  cv.classList.remove('drag');
  const t = document.getElementById('tmpwire'); if(t) t.remove();
});
function drawTemp(ev){
  const svg = document.getElementById('links');
  let t = document.getElementById('tmpwire');
  if(!t){ t = document.createElementNS('http://www.w3.org/2000/svg','path');
    t.id='tmpwire'; t.setAttribute('stroke','#58a6ff');
    t.setAttribute('stroke-width','2'); t.setAttribute('fill','none');
    t.setAttribute('stroke-dasharray','5 4'); svg.appendChild(t); }
  const r = cv.getBoundingClientRect();
  const wx = (ev.clientX - r.left - view.x)/view.k;
  const wy = (ev.clientY - r.top  - view.y)/view.k;
  const a = portPos(dragLink.node+'.'+dragLink.port, dragLink.dir);
  if(!a) return;
  t.setAttribute('d', dragLink.dir==='out' ? curve(a,{x:wx,y:wy}) : curve({x:wx,y:wy},a));
}
cv.addEventListener('wheel', ev=>{
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = ev.clientX-r.left, my = ev.clientY-r.top;
  const k2 = Math.min(2.4, Math.max(0.16, view.k * (ev.deltaY<0 ? 1.12 : 1/1.12)));
  view.x = mx - (mx-view.x)*(k2/view.k);
  view.y = my - (my-view.y)*(k2/view.k);
  view.k = k2; applyView();
}, {passive:false});
window.addEventListener('keydown', ev=>{
  if(ev.target.tagName==='INPUT'||ev.target.tagName==='TEXTAREA') return;
  if((ev.key==='Delete'||ev.key==='Backspace') && sel){
    ev.preventDefault();
    if(sel.type==='link') delLink(); else delNode();
  }
});

function fit(){
  const ns = G.nodes; if(!ns.length) return;
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const n of ns){ const el=document.getElementById('nd_'+n.id);
    const hh = el ? el.offsetHeight : 260;
    x1=Math.min(x1,n.x); y1=Math.min(y1,n.y);
    x2=Math.max(x2,n.x+(n.w||210)); y2=Math.max(y2,n.y+hh); }
  const r = cv.getBoundingClientRect();
  const k = Math.min(2, Math.max(0.16, Math.min((r.width-60)/(x2-x1), (r.height-60)/(y2-y1))));
  view.k = k; view.x = 30 - x1*k; view.y = 30 - y1*k; applyView();
}
function focusNode(id){
  const n = nodeById(id); if(!n) return;
  const r = cv.getBoundingClientRect();
  view.x = r.width/2 - (n.x + (n.w||210)/2)*view.k;
  view.y = r.height/2 - (n.y+120)*view.k;
  applyView();
}
function layerOf(){
  // 最长路径分层；先用 DFS 剔除回边，保证是 DAG。
  const ids = G.nodes.map(n=>n.id), idset = new Set(ids);
  const fwd = [];
  for(const l of G.links){
    if(l.kind==='ctrl') continue;
    const a=l.from.split('.')[0], b=l.to.split('.')[0];
    if(a!==b && idset.has(a) && idset.has(b)) fwd.push([a,b]);
  }
  const adj = {}; ids.forEach(i=>adj[i]=[]);
  fwd.forEach(([a,b])=>adj[a].push(b));
  const color = {}, back = new Set();
  const dfs = u => { color[u]=1;
    for(const v of adj[u]){ if(color[v]===1) back.add(u+'>'+v);
      else if(color[v]===undefined) dfs(v); }
    color[u]=2; };
  ids.forEach(i=>{ if(color[i]===undefined) dfs(i); });
  const dag = fwd.filter(([a,b])=>!back.has(a+'>'+b));
  const d = {}; ids.forEach(i=>d[i]=0);
  for(let k=0;k<ids.length+2;k++){ let moved=false;
    for(const [a,b] of dag) if(d[b]<d[a]+1){ d[b]=d[a]+1; moved=true; }
    if(!moved) break; }
  return d;
}
function estH(n){
  let h = 30;
  if(n.sub) h += 15*Math.min(3,Math.max(1,Math.ceil(n.sub.length/34))) + 5;
  h += 6 + 16*Math.max((n.ins||[]).length,(n.outs||[]).length);
  const par = n.params||[];
  if(par.length){ const c = par.reduce((s,p)=>s+String(p[0]).length+String(p[1]).length+2,0);
    h += 8 + 20*Math.max(1,Math.ceil(c/43)); }
  const nb = (n.bullets||[]).length;
  if(nb){ const t = n.bullets.reduce((s,b)=>s+b.length+2,0);
    h += 12 + 14*Math.max(nb,Math.ceil(t/41)); }
  return h + 14;
}
function tidy(){
  const d = layerOf();
  const layers = {}; let maxd = 0;
  for(const n of G.nodes){ const k=d[n.id]||0; maxd=Math.max(maxd,k);
    (layers[k]=layers[k]||[]).push(n); }
  // 层内按前驱重心排序，减少交叉
  const pos = {};
  for(let k=0;k<=maxd;k++) (layers[k]||[]).forEach((n,i)=>{ pos[n.id]=i; });
  const pred = {};
  for(const l of G.links){ if(l.kind==='ctrl') continue;
    const a=l.from.split('.')[0], b=l.to.split('.')[0];
    if(a!==b) (pred[b]=pred[b]||[]).push(a); }
  for(let it=0; it<6; it++){
    const rev = it%2===1;
    for(let k = rev?maxd:0; rev?k>=0:k<=maxd; k += rev?-1:1){
      const col = layers[k]||[]; if(!col.length) continue;
      const key = {};
      col.forEach((n,i)=>{ const nb = rev ? [] : (pred[n.id]||[]);
        const vals = rev ? [] : nb.map(m=>pos[m]).filter(v=>v!==undefined);
        key[n.id] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : i; });
      col.sort((a,b)=> key[a.id]-key[b.id] || pos[a.id]-pos[b.id]);
      col.forEach((n,i)=>{ pos[n.id]=i; });
    }
  }
  const COLW=392, X0=40, Y0=40, GAP=34, BANDGAP=90;
  const C = Math.max(1, Math.min((G.layout && G.layout.bands) || 7, maxd+1));
  const colH = col => col.reduce((s,n,i)=>s+estH(n)+(i?GAP:0),0);
  let y = Y0;
  for(let b0=0; b0<=maxd; b0+=C){
    const ks = []; for(let k=b0;k<Math.min(b0+C,maxd+1);k++) ks.push(k);
    let bandH = 0; ks.forEach(k=>{ bandH = Math.max(bandH, colH(layers[k]||[])); });
    ks.forEach((k,i)=>{
      const col = layers[k]||[];
      let yy = y + Math.max(0,(bandH-colH(col))/2);
      col.forEach(n=>{ n.x = X0 + i*COLW; n.y = yy; yy += estH(n)+GAP; });
    });
    y += bandH + BANDGAP;
  }
  renderAll(); fit();
}
function startView(){
  // 单条链宽 5000+px，fit() 只能给 ~0.25 缩放（字太小读不了）。
  // 默认落在入口节点附近、0.75 缩放；要看全貌按「适应窗口」。
  const first = G.nodes.find(n=>n.id==='input') || G.nodes[0]; if(!first) return;
  const r = cv.getBoundingClientRect();
  view.k = 0.75;
  view.x = 40 - first.x*view.k;
  view.y = Math.max(20, r.height*0.34 - (first.y+130)*view.k);
  applyView();
}

/* ---------- 候选节点 ---------- */
function addFromList(){
  const used = new Set(G.nodes.map(n=>n.id));
  const avail = BASE.nodes.filter(n=>!used.has(n.id));
  if(!avail.length) return alert('基线里的节点都已经在画布上了。');
  const names = avail.map((n,i)=>(i+1)+'. '+n.title);
  const s = prompt('加哪个？\n'+names.join('\n'), '1');
  const i = parseInt(s,10)-1;
  if(!isNaN(i) && avail[i]) insertNode(JSON.parse(JSON.stringify(avail[i])));
}
function addNode(kind){
  const title = prompt('新节点标题：','新节点');
  if(!title) return;
  const g = G.groups.find(x=>x.id==='cand') || G.groups[0];
  insertNode({id:'n_'+Date.now().toString(36), group:g.id, kind:kind, title:title,
    sub:'', x:300, y:760, w:220, file:'', ins:[{id:'in',label:'输入'}],
    outs:[{id:'out',label:'输出'}], params:[], bullets:[], note:''});
}
function insertNode(n){
  const c = cv.getBoundingClientRect();
  n.x = Math.round((c.width/2 - view.x)/view.k - 110);
  n.y = Math.round((c.height/2 - view.y)/view.k - 60);
  G.nodes.push(n); sel={type:'node', id:n.id}; renderAll(); focusNode(n.id);
}

/* ---------- 导入导出 / 差异 ---------- */
function diff(){
  const bn = new Map(BASE.nodes.map(n=>[n.id,n])), cn = new Map(G.nodes.map(n=>[n.id,n]));
  const bl = new Map(BASE.links.map(l=>[linkId(l),l])), cl = new Map(G.links.map(l=>[linkId(l),l]));
  return {
    addNodes: G.nodes.filter(n=>!bn.has(n.id)).map(n=>n.title),
    delNodes: BASE.nodes.filter(n=>!cn.has(n.id)).map(n=>n.title),
    addLinks: G.links.filter(l=>!bl.has(linkId(l))).map(l=>l.from+' → '+l.to),
    delLinks: BASE.links.filter(l=>!cl.has(linkId(l))).map(l=>l.from+' → '+l.to),
    chgNodes: G.nodes.filter(n=>bn.has(n.id) && JSON.stringify(n)!==JSON.stringify(bn.get(n.id)))
                     .map(n=>n.title)
  };
}
function changesText(){
  const d = diff(), L = [];
  L.push('# 工作流改动（相对基线：'+BASE.name+'，'+BASE.score+' 分）');
  L.push('');
  if(!d.addNodes.length && !d.delNodes.length && !d.addLinks.length && !d.delLinks.length && !d.chgNodes.length){
    L.push('（无改动）'); return L.join('\n');
  }
  if(d.addNodes.length){ L.push('## 新增节点'); d.addNodes.forEach(x=>L.push('- '+x)); L.push(''); }
  if(d.delNodes.length){ L.push('## 删除节点'); d.delNodes.forEach(x=>L.push('- '+x)); L.push(''); }
  if(d.addLinks.length){ L.push('## 新增连线'); d.addLinks.forEach(x=>L.push('- '+x)); L.push(''); }
  if(d.delLinks.length){ L.push('## 删除连线'); d.delLinks.forEach(x=>L.push('- '+x)); L.push(''); }
  if(d.chgNodes.length){ L.push('## 改过内容的节点'); d.chgNodes.forEach(x=>L.push('- '+x)); L.push(''); }
  L.push('## 画布上全部节点（按分组）');
  for(const g of G.groups){
    const ns = G.nodes.filter(n=>n.group===g.id);
    if(!ns.length) continue;
    L.push(''); L.push('### '+g.title);
    for(const n of ns) L.push('- ['+n.kind+'] '+n.title+(n.sub?(' — '+n.sub):''));
  }
  L.push(''); L.push('## 全部连线');
  G.links.forEach(l=>L.push('- '+l.from+' → '+l.to));
  return L.join('\n');
}
function showChanges(){ openDlg('改动说明（贴回给我）', changesText()); }
function showJSON(){ openDlg('graph.json（导出后可让我读）', JSON.stringify(G,null,1)); }
function importJSON(){
  const s = prompt('把 graph.json 全文粘进来：');
  if(!s) return;
  try{ G = JSON.parse(s); sel=null; renderAll(); fit(); }catch(e){ alert('JSON 解析失败：'+e.message); }
}
function openDlg(t,txt){
  document.getElementById('dlgtitle').textContent = t;
  document.getElementById('dlgtext').value = txt;
  document.getElementById('dlg').classList.add('on');
  document.getElementById('dlgtext').select();
}
function closeDlg(){ document.getElementById('dlg').classList.remove('on'); }
function copyDlg(){
  const t = document.getElementById('dlgtext');
  t.select(); document.execCommand('copy');
  navigator.clipboard && navigator.clipboard.writeText(t.value).catch(()=>{});
}
window.addEventListener('resize', applyView);

document.getElementById('ver').textContent =
  'v' + FP + ' · ' + G.nodes.length + ' 节点 / ' + G.links.length + ' 连线';
renderAll(); startView();
</script>
