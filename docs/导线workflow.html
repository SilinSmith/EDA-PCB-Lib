<style>
:root{--bg:#12151c;--pn:#1b202b;--bd:#2c3444;--tx:#dfe6f2;--dim:#8b98ad;--ac:#5cc8ff;--ok:#5ad07a;--wn:#f0b429;--er:#ff6b6b}

 repeating-linear-gradient(0deg,#161a22,#161a22 24px,#181d26 24px,#181d26 25px),
 repeating-linear-gradient(90deg,#161a22,#161a22 24px,#181d26 24px,#181d26 25px)}
#cv{position:absolute;left:0;top:0;transform-origin:0 0}
.node{position:absolute;width:250px;background:#1e2431;border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:8px;padding:8px 10px;cursor:pointer}
.node.data{border-left-color:#a78bfa}.node.param{border-left-color:var(--wn)}.node.exec{border-left-color:var(--ok)}

.node .t{font-weight:600;font-size:13px}.node .s{color:var(--dim);font-size:11px;margin-top:3px}
.node .g{color:#5cc8ff;font-size:10px;margin-top:4px;opacity:.85}
svg.links{position:absolute;left:0;top:0;pointer-events:none}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--bd);padding:3px 6px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500}
code,kbd{background:#0e1219;border:1px solid var(--bd);border-radius:4px;padding:0 4px;font-size:11.5px}
ul{margin:6px 0 0 16px;padding:0}li{margin:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv b{color:#9fb3cd;font-weight:500}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:0 8px;font-size:11px;color:var(--dim);margin-right:6px}
b.hl{color:var(--wn)}.mono{font-family:Consolas,monospace;font-size:11.5px}
#detail{max-height:74vh;overflow:auto}

<script type="application/json" id="docmd">"# 导线识别 workflow —— 分阶段材料（可直接嵌入 `导线 workflow.html`）\n\n> 口径说明：本文所有数字**实测**自现成产物，未重跑 stage1。\n> 官方 9 张 = case 1,2,3,4,5,7,8,9,10（`work\\_fast_out_reg9\\final_results`）；\n> 派生 19 张 = `work\\_f220_A\\*.json`（含 0083/0090 等）。\n> 评测器 `eda-pcb\\schematic_parser\\metrics.py`，net_line 权重 **0.10**。\n> 复现脚本都在 `work\\tools\\diag\\`（前缀 `_wire`），日志 `work\\_wire*.txt/json`。\n\n## 0 先纠一个致命误解：net_line 是「一条 (net, edge) 一个实例」\n\n- `eda-pcb\\schematic_parser\\metrics.py:522-562` `net_line_f1`：GT 的 `nets[k][\"edges\"]` 里**每个 `edge_N` 算一个实例**，不是每个 net 一个。官方 9 张 GT 共 **553 条边**、我们输出 **1005 条**。\n- 两级匹配：先 `match_nets`（`metrics.py:477-494`）用 `net_pin_set`（= `parse_hypergraph(net[\"hyperGraph\"])` 的 `(comp,pinnum)` 集合）做匈牙利，**只要有引脚交叠就配上**；配上的网对内部再对边做匈牙利（`_assign`，`:258-282`）。\n- 边的判据 `_seg_distance`（`:246-255`）**只比两个端点坐标取 max**，`line_unordered` 时对调端点取 min，阈值 `cfg.line_tol=5.0`（`work\\tools\\eval\\stage2_eval.py:110`）。**不比方向、不比长度、不比中间点。**\n- 未配上的网：预测侧未配上的网其边全记 fp、GT 侧未配上的网其边全记 fn（`:553-560`）。任一顶点解析失败整条边返回 `None`、**静默不计分**（`:534-537`）。\n- 官方面官方依据：`metrics.py:13-24` 引 `docs\\QA_2025.txt` Q3.1「LineF1 按端点匈牙利匹配」、Q5/Q6「Vcc/GND 是 ∅，直接坐标匹配」。\n\n## 1 漏斗：导线在哪一步消失（官方 9 张）\n\n| 阶段 | 产物 | 数量 | 相对 GT |\n|---|---|---:|---|\n| GT net_line 实例 | `nets[*].edges[*]` | **553** | 1× |\n| stage1 线段（`wire_detail.segments`） | 全部段 | 400+ | — |\n| stage1 网内段（`nets[*].seg_index`） | 进了某个网的段 | **1730** | 3.13× |\n| stage2 边（`runs/stage2/<c>.json`） | `edges` | **979** | 1.77× |\n| 输出边（`final_results` / `_f220_A`） | `edges` | **1005** | 1.82× |\n\n- **fn 405 的三段拆分（实测）**：网没配上 **26 (6.4%)** ｜ 网配上了但预测零边 **123 (30.4%)** ｜ 几何 >5px **256 (63.2%)**。\n- 派生 19 张：GT 2824 边、stage1 网内段 4777、stage2 边 1076、输出边 1563（tp 35 / fp 1528 / fn 2789）；fn 拆 **1403 / 640 / 746**。\n- 逐 case 表（`s1网/段 → s2网/边 → 输出边`，fn 网/零边/几何，元件键命中/预测元件数）见下表。\n\n| case | GT 网/边 | 预测 网/边 | stage1 网/段 | stage2 网/边 | 输出边 | fn 网/零边/几何 | 元件键命中/预测 |\n|---|---|---|---|---:|---|---|---|\n| 1 | 10/102 | 17/206 | 57/495 | 16/206 | 206 | 0/32/50 | 7/22 |\n| 2 | 24/40 | 14/51 | 45/117 | 13/48 | 51 | 20/0/16 | 12/28 |\n| 3 | 16/47 | 18/94 | 35/125 | 17/91 | 94 | 0/5/31 | 15/26 |\n| 4 | 14/60 | 14/122 | 51/189 | 14/122 | 122 | 0/17/17 | 13/25 |\n| 5 | 17/57 | 19/96 | 56/157 | 17/85 | 96 | 0/6/32 | 11/27 |\n| 7 | 13/69 | 17/124 | 35/186 | 17/124 | 124 | 0/8/38 | 18/24 |\n| 8 | 18/56 | 14/84 | 35/140 | 14/85 | 84 | 6/7/19 | 11/20 |\n| 9 | 11/39 | 13/83 | 30/122 | 13/83 | 83 | 0/22/15 | 10/17 |\n| 10 | 15/83 | 19/145 | 34/199 | 17/135 | 145 | 0/26/38 | 19/30 |\n| 0092 | 51/156 | 7/133 | 51/315 | 2/133 | 133 | 94/61/1 | 1/50 |\n| 0048 | 30/128 | **0/0** | 32/305 | **0/0** | **0** | 128/0/0 | 0/39 |\n| 0019 | 102/269 | 30/16 | 52/155 | 2/1 | 16 | 168/61/40 | 6/35 |\n| 0024 | 38/150 | 26/144 | 36/252 | 5/16 | 144 | 16/88/46 | 7/29 |\n| 0086 | 52/223 | 10/154 | 105/476 | 2/15 | 154 | 175/0/48 | 6/67 |\n| 0042 | 13/84 | 7/25 | 21/74 | 4/25 | 25 | 64/15/5 | 1/16 |\n| 0075 | 56/191 | 8/19 | 48/308 | 3/2 | 19 | 151/9/30 | 2/71 |\n| 0083 | 17/69 | 4/129 | 13/285 | 2/105 | 129 | 49/1/19 | 2/14 |\n| 0090 | 14/57 | 3/49 | 14/145 | 3/49 | 49 | 42/0/15 | 4/16 |\n| 0057 | 23/98 | 4/266 | 7/412 | 4/266 | 266 | 65/2/30 | 8/26 |\n| 0062 | 10/28 | 5/11 | 16/94 | 4/0 | 11 | 12/15/1 | 2/11 |\n| 0032 | 16/57 | 2/147 | 5/243 | 1/144 | 147 | 54/0/3 | 3/20 |\n| 0028 | 50/232 | 12/99 | 98/449 | 2/20 | 99 | 161/38/33 | 4/68 |\n| 0175 | 113/397 | 82/81 | 148/379 | 46/62 | 81 | 60/150/184 | 48/108 |\n| 0198 | 64/148 | 39/56 | 72/172 | 24/35 | 56 | 50/36/60 | 15/52 |\n| 0105 | 37/109 | 18/83 | 49/172 | 17/80 | 83 | 31/23/48 | 14/57 |\n| 0106 | 133/323 | 91/85 | 139/384 | 59/57 | 85 | 78/95/146 | 40/101 |\n| 0036 | 18/33 | 13/32 | 38/87 | 13/32 | 32 | 5/4/9 | 9/19 |\n| 0120 | 10/72 | 18/34 | 44/70 | 18/34 | 34 | 0/42/28 | 23/30 |\n\n**stage2 是第一大单点闸门**：官方 9 张里 stage1 的 57/45/35/51/56/35/35/30/34 个网，到 stage2 只剩 16/13/17/14/17/17/14/13/17 个 —— 因为 `eda-pcb\\stage2\\assemble.py:900 if not refs: continue` 把「有边但一个引脚都没连上」的网整网丢掉。\n\n## 2 阶段说明（这份是要直接进页面的正文）\n\n### S1 灰度 / 彩度判定（决定用哪个通道二值化）\n- **做什么**：彩色图先问一次 VLM「这块图里导线是什么颜色」，据此选通道；判成灰度就跳过询问。\n- **代码落点**：`eda-pcb\\pipeline\\pskel.py:155`（`STAGE1_WIRE_COLOUR`，默认 `hint`）、`:175`（`h55`/`h85` 强制色相）、`eda-pcb\\stage1\\wires.py:290`（`(chroma(bgr) >= 22.0).sum() < 200` 直接跳过）。\n- **参数/默认**：`STAGE1_WIRE_COLOUR=hint`；`STAGE1_WIRE_HUE_TIMEOUT=30`、`STAGE1_WIRE_HUE_MAXFAIL=3`、`STAGE1_WIRE_HUE_MAXSIDE=1024`（`wires.py:232/233/250-262`）。\n- **中间产物**：`pskel.HINT_HUE`（进程内），结果只体现为二值化掩膜。\n- **实测吞吐**：220 张里 **168 张触发**、52 张灰度跳过；`0003`（4491×3173）整图 base64 调用耗 **303 s**，而 yolo/cv/wires/rays/text/bigic/pins 加起来只有 4.3 s ⇒ **这是 stage1 的时间黑洞**。缩到 1024 后 0.55 s。hue 加固后 220 张 stage1 共 **416.5 s（1.89 s/张）**。\n- **已知失效模式**：整图调用会 HTTP 400 / 超时（`VLM_TIMEOUT` 默认 600 s）。判据只能用**绝对个数**不能用分位数——稀疏图纸绿导线占比 <1% 会被误判灰度。\n\n### S2 遮挡元件与文字 + 降采样\n- **做什么**：把元件框、文字框涂成背景色，再把超过 `max_pixels` 的图按面积比降采样。\n- **代码落点**：`eda-pcb\\stage1\\wires.py:56-74` `occlude_boxes`、`:45-53` `_background_colour`、`:38-42` `_use_scale`（下限 0.25，坐标最后 ×`1/s`，`:371-374`）；调用点 `eda-pcb\\stage1\\pipeline.py:215-219`。\n- **参数/默认**：`max_pixels=2_500_000`（`wires.py:35`）、`occ_pad=2.0`、`erase_pad=1.0`。\n- **实测**：不遮挡时提取总长是 GT 的 **5.04 倍**、只有 **6%** 压在真导线上；遮挡后 jlc 的 P **0.049→0.154**、F1 **0.084→0.191**（`pipeline.py:194-214`）。\n\n### S3 pskel 骨架 + 折线/线段拟合\n- **做什么**：墨迹 → 细化得到 1px 骨架 → RDP 拟合成折线 → 折线拆线段。\n- **代码落点**：`eda-pcb\\pipeline\\pskel.py`（zhang_suen + RDP）；`eda-pcb\\stage1\\wires.py:318-369` `extract_wires` 构造 `WireExtractor(ink_mode, thin_w, use_colour, rdp_eps, snap)`（`:365-366`）。\n- **参数/默认**：`ink_mode='adaptive'`、`thin_w=1.6`、`rdp_eps=1.6`、`snap=True`、`use_colour=True`。\n- **实测吞吐**：官方 9 张 `wires_s` 0.62~1.70（均值 ≈0.89）、`rays_s` 0.02~0.11、`total_s` 1.96~4.37（均值 ≈2.44）；派生 19 张 `total_s` 0.32~3.40。纯 Python 循环 + numpy、**GIL 绑死**（`wires.py:1-6`），最大单张 `0171`（1675×1190）**88.5 s**。\n- **已知失效模式**：`snap` 会把一条走线接成**一整段**（即使中间过 T 形分叉），于是结点数出 0，而官方 GT 的边是在分叉处切开的 —— `0001` 我们 153 条 vs GT **340 条**（`wires.py:505-514`）。\n\n### S4 上游裁剪（长度 / 大尺度连通量 / 轴向 / 图框）\n- **代码落点**：`wires.py:377-398` 折线级长度过滤、`:400-478` 大尺度连通过滤、`:480-495` 逐段（`min_len`/`max_axis_dev`/`drop_frame`）、`:89-101` `_is_frame`。\n- **参数/默认（线上实际）**：`min_extent=80.0`、`rescue_pad=8.0`、`max_axis_dev=12.0`、`drop_frame=True`、`frame_margin_frac=0.03`、`frame_len_frac=0.30`；`min_len=0`、`min_poly_len=0`（都不开）。\n- **实现要点**：连通量在**墨迹掩膜**上算（`ink=dilate(ink,3×3)`，`:416-417`，因为 zhang_suen 会在交叉/毛刺处断连），线段用 5 点投票（`t=0.1..0.9`）认领分量，`diag < min_extent` 才删，**采不到标签时保守不删**（`:464-473`）。\n- **实测收益**：`min_extent=80+rescue_pad=8` 相对不设门槛：0101 0.223→0.252、0059 0.193→0.315、0001 0.158→0.165、0011 0.036→0.049（全部优于基线）。\n- **已知失效模式**：⚠️ 在 **segment 级**按长度过滤会把真导线一起删（0101 上 F1 从 0.19 **直接归零**）⇒ 必须先按 polyline 长度筛。`max_axis_dev=8°` 会把 KiCad 45° 斜段误伤（0001 0.168→0.151），取 12° 折中。\n\n### S5 T 形分叉切段（口径修正）\n- **代码落点**：`wires.py:108-145` `_split_at_nodes`；开关 `STAGE1_SPLIT_JUNCTIONS=1`（`:516`）、`STAGE1_SPLIT_TOL=1.5`（`:518`）。\n- **做什么**：别的段端点落在本段内部（垂距 ≤1.5、`t∈(1e-3,1-1e-3)`）就切开；切点取自**原始** segments 的全部端点，切出的新端点不再参与（避免级联）。\n- **实测收益**：220 张干净 A/B（同源检测、只换线段）`stage1_v6` **23.9559 → `_s1js` 24.0117（+0.0558）**，component 逐位不变，增益全在 net_line：**F1 0.0197→0.0241、tp 578→876、P 0.0186→0.0207**。\n\n### S6 端点 / 结点记账\n- **代码落点**：`wires.py:148-166` `_rebuild_nodes(tol=1.0)`（桶内 1 点=端点、≥3 点=结点取质心、2 点=过路点）、`:169-209` `_comp_stats`（并查集分量 extent/总长）。\n- **产物**：`extract_wires` 返回 dict（`wires.py:524-553`）里的 `segments / endpoints / junctions / n_segments / n_endpoints / n_junctions / n_components / n_dropped_comp / n_segments_split / n_dropped_poly` 等。**`wires.py` 不产 edges/net**。\n\n### S7 射线补召回\n- **代码落点**：`pipeline.py:239-255`（`do_rays and do_wires`）：`ink=(gray<ray_mod.INK)`，`rays=trace_from_boxes(ink, cboxes)`，然后 `w[\"segments\"] += rays`（**骨架段与射线段直接拼接**）。\n- **实测**：220 张（tol 5px）：骨架 F1 0.2701 / R 0.2730；射线 F1 0.2661 / R 0.5459；**并集 F1 0.3569 / R 0.6827（召回 2.5 倍、F1 +32%）**。射线救回骨架漏掉的 GT 边里 `other` 的 64%、`in_text` 的 54%。\n- **已知失效模式**：⚠️ **别加 anchors / clip_anchors / require_anchor**：full+rays 覆盖 F1 0.4434，加 `require_anchor` 掉到 0.3394，引脚未绑定率 14.9%→26.6%（「走到尽头没碰到锚点」的射线会被整条丢掉）。\n\n### S8 端点焊接 / 穿线成组 `wire_groups`（4 条规则）\n- **代码落点**：`eda-pcb\\stage1\\labels.py:425-426` `wire_groups(...)`；规则(3) `_weld_unions`（`:299`）、规则(4) `_extend_unions`（`:354`）、规则(5) `_overshoot_unions`（`:220`）；调用点 `:475-488`。\n- **参数/默认**：`STAGE1_WIRE_TOL=1.5`、`STAGE1_WIRE_EXT=8.0`、`STAGE1_WIRE_EXT_PERP=2.0`、`STAGE1_WIRE_WELD=16.0`、`STAGE1_WIRE_PERP=1.5`、`STAGE1_WIRE_COS=-0.75`、`STAGE1_WIRE_INK=1`、`STAGE1_WIRE_INK_FRAC=0.5`、`STAGE1_WIRE_OVER=12`、`STAGE1_WIRE_OVER_CROSS=0`、`STAGE1_WIRE_OVER_COS=0.9`。\n- **★ `perp`/`weld` 的教训（`labels.py:98-129`）**：case 1 右侧 GND 竖轨在 `x=1431/1433` 抖 2px，被结点圆点切成 `y=212-224 / 242-254 / 271-283 / 301-312 / 330-372` 五段、缺口 17~18px；`perp=(2/18)*18.1≈2.0` 压不住老默认 1.5 ⇒ **端点明明在 weld 半径内也被 perp 拒掉**，这就是「weld 看起来没用」的真因。\n- **实测网格**：10GT `weld16/perp1.5` 42.5191；`weld24/perp1.5` **42.2083（更差）**；`weld24/perp10` 42.9809；**`weld24/perp14` 峰值 43.0507**；`weld28/perp17` 41.3243。全量 220：`weld16/perp1.5` **24.8651** vs `weld24/perp14` 23.9684 ⇒ **默认留在 16.0 / 1.5**（KiCad 风格图纸要开得显式设 env）。ext 网格：`ext=0` F1 0.2636 → `ext=8` **0.3110（峰）** → `ext=64` 0.0597（GT 自己的天花板 0.7736/0.6580，早越过）。规则(5) 一开，`WIRE_TOL` 取 1.5/2/3 逐位相同（=56.31）。\n- **已证伪的路（别重复造）**：`WIRE_TOL=10` 是钝补丁（9 张 55.07→55.89 但 case 10 −0.96 / case 4 −1.10，把电容极板并成短路）；方向性桥接在 `ext=0` 时 R 只 0.1752→0.1950 而 P 0.5317→0.4388。\n\n### S9 引脚挂段 → 成网 `build_nets`\n- **代码落点**：`eda-pcb\\stage1\\nets.py:103-152` `build_nets`；硬截断 `:210-211 if dist[m] > jdm: return -1`、`:218/:236 if g < 0: continue`；空网丢弃 `:242-243 if len(pin_list) < min_pins: continue`。\n- **参数/默认**：`STAGE1_PIN_JOIN_DIST=12`、`STAGE1_PIN_JOIN_FAR=0`、`STAGE1_PIN_JOIN_SYNTH=3`、`STAGE1_PIN_ATTR=nearest`（可选 `longest`）、`STAGE1_PIN_ATTR_SLACK=6`、`MIN_NET_PINS=1`。\n- **产物**：`nets=[{\"id\",\"pins\":[[comp,pin_index]],\"n_seg\",\"seg_index\"}]` + `seg_groups`；写进 stage1 JSON 的 `nets`（**没有 `edges` 键**，`edges` 是 stage2 才建的）。\n- **实测**：`n_nets_no_pin` 在官方 9 张与派生 19 张里**恒为 0** ⇒ 空网丢弃在这两批没触发。case 1 的 `U1` 34 个脚到最近导线段距离 **p50=45.6px / p90=173px**，只 8/34 在 5px 内 ⇒ `PIN_JOIN_DIST=12` 这道闸门很可能是 net_hypergraph 召回的大漏勺（`nets.py:32-37` 注释实测）。\n\n### S10 stage2 装配：网 → `edges` + `hyperGraph`\n- **代码落点**：`eda-pcb\\stage2\\assemble.py:831-883` 建 raw 网（`:843` **y 轴翻转** `y=H-p[1]`、`:848-849` `merge_collinear`、`:853-856` `MIN_EDGE_LEN` 闸门、`:857` 写 `edges[\"edge_%d\"]`、`:885` `merge_by_label(merge_by_symbol(...))`）、`:900` `if not refs: continue`、`:904` `attach_orphan_rails`、`:905` `merge_shared_pins`、`:906-909` `snap_edge_ends`。\n- **参数/默认**：`STAGE2_MIN_EDGE_LEN=20.0`（`:201`；扫参 0→netL 0.0399 / 8→0.0442 / 12→0.0466 / 20→0.0494 / **25→0.0514** / 30→tp 掉 37）、`STAGE2_EDGE_MERGE=0`（`:227`）、`STAGE2_EDGE_JOIN=40.0`、`STAGE2_EDGE_ANG=6.0`、`STAGE2_EDGE_SNAP=20.0`（`:246`）、`STAGE2_EDGE_SNAP_ANG=45.0`、`STAGE2_NET_DROP_UNKEYED=1`（`:164`）、`STAGE2_SYM_MERGE=0`（`:187`）、`STAGE2_RAIL_ATTACH=1`（`:917-921`）。\n- **★ 最大闸门 `:900 if not refs: continue`**：把「有边但一个引脚都没连上」的网整网丢掉。2026-07 审计曾改成 `if not refs and not v.get(\"edges\")`，实测**否证已回退**（10GT 无 VLM 48.35→46.88；netH tp −14/fp +14/fn +14、net_line fp +124），根因：`attach_orphan_rails` 与 `merge_shared_pins` 都在这个循环**之后**跑，被保留的网会去抢轨引脚。\n- **端点吸附 `snap_edge_ends`（`:259-307`）**：把端点投到**同 net 邻居的有限线段**垂足上（`t` clip 到 [0,1]），半径 20、夹角 ≤45°。离线复刻 + 穷举实测：**65% 的端点满足吸附判据、899 个真会动，吸完更靠 GT 端点的 340 个 / 更远的 325 个（净值≈0，位移中位 2.0px）**。\n\n### S11 输出与融合\n- 输出文档：`{\"case\",\"components\",\"pins\",\"nets\",\"__pin_index\"}`；边形状 `{\"edge_N\":[{\"x\":..,\"y\":..},{\"x\":..,\"y\":..}]}`。\n- `eda-pcb\\submission\\run.py:18-24` 目录契约（`runs/stage1|stage2|stage3`）、`:241` stage2、`:260` stage3（**从 `_assigned` + stage1 重建**，不是拷 stage2）；`:295-355` VLM 段有 try/except 兜底。\n\n## 3 头条结论：63.2% 的 fn 是「端点精度」，而 t 容差是固定的 5px\n\n**容差 vs tp（官方 9 张离线重算，`work\\tools\\diag\\_wirefix.py`，输入 `work\\_f220_A\\*.json`）**\n\n| `line_tol` | tp | fp | fn | F1 | mean score |\n|---:|---:|---:|---:|---:|---:|\n| **5.0（官方默认）** | **148** | 857 | 405 | 0.1900 | 58.63 |\n| 10 | 239 | 766 | 314 | 0.3068 | 59.91 |\n| 20 | 316 | 689 | 237 | 0.4056 | 60.78 |\n| 40 | 346 | 659 | 207 | 0.4442 | 61.23 |\n| 60 | 346 | 659 | 207 | 0.4442 | 61.23 |\n\n- 骨架在 **20px 内找对了 91.9%** 的 GT 边（tol10 65.3%、tol5 只有 **14.6%**）—— 口径实测来自 `_wireskel.py`（GT 边坐标 y 翻转后直接比 stage1 `wire_detail.segments`）。\n- ⇒ **63.2% 的 fn 是几何误差**：5→10 回收 **91 条**，10→20 再回收 **77 条**，**剩下 207 条任何容差都救不回**（结构性：错连、整条漏、网错配）。\n- 派生 19 张同口径：tol5 19.3% / tol10 45.2% / tol20 67.4%，且 **73% 的 GT 边到最近预测边 >40px**（整批错位，不是像素抖动）。\n\n## 4 「只修一个环节该修哪个」\n\n| 优先级 | 候选 | 改哪里 | 实测 | 风险 |\n|---|---|---|---|---|\n| **1** | **网级配对口径** | 我们的行为：少输出「单脚空网」、让网与 GT 网一对一（`metrics.py:477-494` 是官方口径，改不了） | 取消网级门禁只做全局边匈牙利（tol=5）：**tp 148→189、fp 857→816、fn 405→364、F1 0.1876→0.2426**；派生 19 张 tp 35→220、F1 0.0160→0.1003 | 中：改动落在网合并/挂脚，会连带 netH(0.35) |\n| **2** | **上游元件键（6 张爆 0 的根因）** | `assemble.py:164 DROP_UNKEYED` + `:660-668` 位号槽位 | `0048`：`desig_slots={}` ⇒ 39/39 元件被丢 ⇒ keymap 空 ⇒ 每网 refs 空 ⇒ `:900` 全丢 ⇒ `nets={}` ⇒ tp0/fp0/fn128 | 高：连带 component(0.30)+pin(0.25) |\n| 3 | (a)(b) 端点吸附到**支撑直线交点** | `assemble.py:259-307`（把「有限线段垂足」换成「支撑直线交点 + 夹角门禁」） | 穷举最好一档 radius40/minang40：tp 148→152、fp 857→853、fn 405→401、**F1 0.1900→0.1951**（动 904 端点、零损失）；基线 148 条一条不丢 | 低（只在同一 net 内搬端点、上限 40px） |\n| 4 | (c) junction 簇端点聚类取质心 | `labels.py:148-166` / stage2 装配前 | 半径 6px、动 1635 端点：**tp/fp/fn 一位不变** | 低，但实测无收益 |\n| — | (d) 碎边并回长边 | `assemble.py:227 EDGE_MERGE=0` / `:310 merge_collinear` | 只能减 fp；现口径下 fn 405 里没有一条能靠并边变 tp | 中（19 张快测「平的且多爆两个零」） |\n| — | 现版 `EDGE_SNAP=20` 本身 | `assemble.py:259-307` | 2010 端点里 65% 可吸、899 真动；吸完**更靠 GT 端点 340 / 更远 325**，净值 0；输出端点落在 GT 端点 3px 内的比例只有 **0~15%** | — |\n\n**建议顺序：1 → 2 → 3。** 理由：端点那一档全部候选加起来最多 +0.0055 F1（×0.10 权重 ≈ +0.055 总分），而网级配对的空间是它的 **10 倍**；且 `snap_edge_ends` 已经在做端点这件事、实测净值 0，说明「把端点搬到邻居线上」这条**几何路线本身**在 5px 口径下不成立（我们一条 GT 边平均被 2~4 条预测边覆盖，切点误差 5~10px，两侧端点同时判负）。\n\n## 5 空网抢配对（配对口径问题，不是几何）—— 页面里单独一格\n\n- `metrics.py:477-494` `match_nets` 相似度 = `inter + (inter/union)*1e-3`，**只看引脚集合交叠**：预测的「单脚空网」（`edges={}`）只要有一个引脚撞上 GT 网，就能把**有边的** GT 网整个抢走 ⇒ 那些 GT 边全记 fn，而我们的有边网去配别的 GT 网 ⇒ 边全记 fp。\n- 实测（`_wirezero.py`）：**case 1 的 17 个预测网里 12 个 `edges={}`**；`_assign` 后 10 对网对里 **6 对是「GT 有边的网 ← 预测空边网」**（`gt net_8(边6脚4) ← net_4(C1518.1)`、`net_3 ← net_6(C152.1)`、`net_2 ← net_7(C1515.1)`、`net_7 ← net_10(C157.1)`、`net_4 ← net_12(C1519.1)`）。\n- 逐 case 空边网/预测网：1 = 12/17 · 3 = 3/18 · 4 = 4/14 · 5 = 6/19 · 7 = 6/17 · 8 = 1/14 · 9 = 8/13 · 10 = 8/19（2 为 0/14）。官方 9 张合计 145 个预测网里 **27 个是空边网**。\n- **离线删掉空网（`_wirefix.py` B 臂）**：tp **148→154**、fp **857→851**、fn **405→399**（都变好），但 **mean score 58.63→58.18（−0.45）**：case 4 −2.11 / 9 −3.30 / 5 −0.58 掉分，1 +0.20 / 7 +1.72 / 10 +0.79 涨分。D19：tp 35→44、score 19.86→18.73。\n- 这些空边网 `hyperGraph` 非空（如 `(C1518.1)`），**不是** `if not refs` 之后新产生的，而是 `merge_by_symbol`（`assemble.py:522`，`SYM_MERGE` 默认 0）留下的「单脚网」。\n\n## 6 派生 19 张里 6 张导线 F1=0 的定性（可复现）\n\n| case | 输出边 | 判定 | 证据 |\n|---|---:|---|---|\n| **0048** | **0** | **真的一条都没输出** | `work\\_f220_A\\0048.json` 的 `nets={}`；`work\\_full220\\runs\\stage2\\_assigned\\0048.json` 的 `comps` 有 39 项、`n_texts=53`，但 **`desig_slots={}` 且 `net_labels=[]`**（对比 case 1 的 `desig_slots` 有 `c0000..`、0092 有 `net_labels` 3 条）⇒ `assemble.py:164 DROP_UNKEYED` 把 39/39 元件丢光 ⇒ keymap 空 ⇒ refs 空 ⇒ `:900` 把 32 个网全丢 |\n| 0092 | 133 | 输出了但全判错 | 7 网 133 边（GT 51 网 156 边）；fn 里 94 条来自「网没配上」；键命中 1/50 |\n| 0019 | 16 | 输出了但全判错且远少于 GT | s1 52 网 155 段 → s2 **2 网 1 边** → 输出 16 边；键命中 6/35 |\n| 0024 | 144 | 输出了但全判错 | s1 36 网 252 段 → s2 5 网 16 边 → 输出 144 边 |\n| 0086 | 154 | 输出了但全判错 | s1 105 网 476 段 → s2 2 网 15 边 → 输出 154 边；键命中 6/67 |\n| 0042 | 25 | 输出了但全判错 | s1 21 网 74 段 → s2 4 网 25 边；键命中 1/16 |\n\n**共同机制（实测）**：这 6 张的预测元件键命中率 **0~1/39~67**（GT9 是 116/219 = 53%）。**「导线 F1=0」不是骨架没画出来，而是 ① 元件配不上 ⇒ 网配不上 ⇒ fn 全丢；② `if not refs` 把有边的网整网丢掉；③ 剩下的边端点落在 5px 窗口外（D19 73% 的 GT 边最近预测边 >40px）。**\n\n## 7 复现命令（全部只读现成产物）\n\n```powershell\n$env:PYTHONIOENCODING='utf-8'; cd Y:\\workspace\\EDA\npython work\\tools\\eval\\stage2_eval.py work\\_fast_out_reg9\\final_results --json work\\_wire_reg9_score.json   # 官方 9 张四项\npython work\\tools\\diag\\_wire // ── 极简 Markdown 渲染（只吃本页用到的那几种语法）
function md2html(src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*]+)\*/g, '$1<i>$2</i>');
  const lines = src.split(String.fromCharCode(10));
  let out = [], i = 0, tbl = null;
  const flushTbl = () => { if (!tbl) return;
    out.push('<table>' + tbl.map((r, k) => '<tr>' + r.map(c =>
      (k === 0 ? '<th>' : '<td>') + inline(c) + (k === 0 ? '</th>' : '</td>')).join('') + '</tr>').join('') + '</table>');
    tbl = null; };
  while (i < lines.length) {
    const L = lines[i];
    if (/^\s*```/.test(L)) { i++; const buf = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; flushTbl(); out.push('<pre class="mono" style="background:#0e1219;border:1px solid #2c3444;border-radius:6px;padding:8px;overflow:auto">' + esc(buf.join(String.fromCharCode(10))) + '</pre>'); continue; }
    if (/^\s*\|/.test(L) && /\|\s*$/.test(L)) {
      const cells = L.trim().replace(/^\||\|$/g, '').split('|').map(s => s.trim());
      if (/^[-:\s|]+$/.test(cells.join('|'))) { i++; continue; }
      (tbl = tbl || []).push(cells); i++; continue; }
    flushTbl();
    let m;
    if ((m = L.match(/^(#{1,4})\s+(.*)$/))) out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>');
    else if (/^\s*>\s?/.test(L)) out.push('<blockquote style="border-left:3px solid #f0b429;margin:6px 0;padding:2px 10px;color:#b9c6d8">' + inline(L.replace(/^\s*>\s?/, '')) + '</blockquote>');
    else if (/^\s*[-*]\s+/.test(L)) { const buf = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) buf.push('<li>' + inline(lines[i++].replace(/^\s*[-*]\s+/, '')) + '</li>');
      out.push('<ul>' + buf.join('') + '</ul>'); continue; }
    else if (/^\s*$/.test(L)) out.push('');
    else out.push('<p>' + inline(L) + '</p>');
    i++;
  }
  flushTbl();
  return out.join(String.fromCharCode(10));
}
document.getElementById('docbody').innerHTML =
  md2html(JSON.parse(document.getElementById('docmd').textContent));
document.getElementById('recipebody').innerHTML =
  md2html(JSON.parse(document.getElementById('recipemd').textContent));
